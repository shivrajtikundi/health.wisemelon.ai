-size: 12px; color: #ccc\">Manipal <span style=\"color: #888\">minoritaria<\u002Fspan><\u002Fdiv>\n<div style=\"padding: 6px 12px; background: #333; border-radius: 3px; font-family: 'IBM Plex Sans', sans-serif; font-size: 12px; color: #ccc\">Quality Care India<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; align-items: center; gap: 16px; padding: 16px; background: #2a2a2a; border-radius: 4px; border-left: 4px solid #7abc8a\">\n<div style=\"min-width: 130px\">\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; color: #fff; font-weight: 600\">Otros<\u002Fdiv>\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 11px; color: #888\">Varios<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex: 1; display: flex; flex-wrap: wrap; gap: 8px\">\n<div style=\"padding: 6px 12px; background: #333; border-radius: 3px; font-family: 'IBM Plex Sans', sans-serif; font-size: 12px; color: #ccc\">Barings → Ujala Cygnus<\u002Fdiv>\n<div style=\"padding: 6px 12px; background: #333; border-radius: 3px; font-family: 'IBM Plex Sans', sans-serif; font-size: 12px; color: #ccc\">Arpwood → Sterling <span style=\"color: #8fbc8f\">100%<\u002Fspan><\u002Fdiv>\n<div style=\"padding: 6px 12px; background: #333; border-radius: 3px; font-family: 'IBM Plex Sans', sans-serif; font-size: 12px; color: #ccc\">Novo Holdings → Manipal <span style=\"color: #888\">min.<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<!-- Vertical-Specific Investments -->\n<h3 id=\"vertical-specific-fertility-womens-care-single-specialty\" style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 18px; font-weight: 600; color: #1a1a1a; margin: 48px 0 16px\">Verticales concretos: fertilidad, salud de la mujer y monoespecialidad<\u002Fh3>\n<p style=\"font-family: Georgia, serif; font-size: 17px; line-height: 1.8; color: #333; margin: 0 0 24px\">Los hospitales monoespecializados han atraído el 20 % de todo el capital riesgo sanitario. Las cadenas de fertilidad y salud de la mujer figuran entre los verticales que más rápido se consolidan, con fondos internacionales tomando posiciones de control e impulsando estrategias de integración.<\u002Fp>\n<div style=\"margin: 32px 0; display: flex; flex-direction: column; gap: 16px\">\n<div style=\"display: flex; gap: 16px; padding: 24px; background: #f0eeea; border-radius: 4px\">\n<div style=\"min-width: 140px; flex-shrink: 0\">\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 15px; font-weight: 600; color: #1a1a1a\">Indira IVF<\u002Fdiv>\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 11px; color: #3a5a40; font-weight: 600; margin-top: 4px\">FERTILIDAD<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex: 1\">\n<div style=\"font-family: Georgia, serif; font-size: 15px; color: #333; line-height: 1.6\">La mayor cadena de FIV de la India (más de 100 clínicas y 3.000 empleados). Adquirida por <strong style=\"color: #1a1a1a\">BPEA EQT<\u002Fstrong> (Suecia). Adquiere activamente clínicas de fertilidad más pequeñas: compró Srishti Hospital en septiembre de 2025.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; gap: 16px; padding: 24px; background: #f0eeea; border-radius: 4px\">\n<div style=\"min-width: 140px; flex-shrink: 0\">\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 15px; font-weight: 600; color: #1a1a1a\">Cloudnine<\u002Fdiv>\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 11px; color: #3a5a40; font-weight: 600; margin-top: 4px\">MUJER E INFANCIA<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex: 1\">\n<div style=\"font-family: Georgia, serif; font-size: 15px; color: #333; line-height: 1.6\">Cadena líder en maternidad, ginecología y pediatría. Inversión inicial de <strong style=\"color: #1a1a1a\">IVFA<\u002Fstrong> (4.000 millones de ₹), participación minoritaria de <strong style=\"color: #1a1a1a\">Temasek<\u002Fstrong> (Singapur). Puja activa por el control de KKR, TPG, Warburg Pincus, Advent, CVC y Permira.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; gap: 16px; padding: 24px; background: #f0eeea; border-radius: 4px\">\n<div style=\"min-width: 140px; flex-shrink: 0\">\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 15px; font-weight: 600; color: #1a1a1a\">Gaudium IVF<\u002Fdiv>\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 11px; color: #3a5a40; font-weight: 600; margin-top: 4px\">FERTILIDAD<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex: 1\">\n<div style=\"font-family: Georgia, serif; font-size: 15px; color: #333; line-height: 1.6\">Más de 30 centros de FIV con un modelo radial sin activos. Salida a bolsa en febrero de 2026 con 1.650 millones de ₹ captados. Hospital de día y farmacia centrados en la mujer.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; gap: 16px; padding: 24px; background: #f0eeea; border-radius: 4px\">\n<div style=\"min-width: 140px; flex-shrink: 0\">\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 15px; font-weight: 600; color: #1a1a1a\">HCG<\u002Fdiv>\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 11px; color: #3a5a40; font-weight: 600; margin-top: 4px\">ONCOLOGÍA<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex: 1\">\n<div style=\"font-family: Georgia, serif; font-size: 15px; color: #333; line-height: 1.6\">La principal cadena oncológica de la India (24 centros). <strong style=\"color: #1a1a1a\">CVC Capital<\u002Fstrong> (Luxemburgo) vendió alrededor del 54 % a <strong style=\"color: #1a1a1a\">KKR<\u002Fstrong> (EE. UU.) por unos 400 millones de dólares, un retorno de 3,4×. Operación secundaria clásica entre fondos.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; gap: 16px; padding: 24px; background: #f0eeea; border-radius: 4px\">\n<div style=\"min-width: 140px; flex-shrink: 0\">\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 15px; font-weight: 600; color: #1a1a1a\">IVF Access<\u002Fdiv>\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 11px; color: #3a5a40; font-weight: 600; margin-top: 4px\">FERTILIDAD<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex: 1\">\n<div style=\"font-family: Georgia, serif; font-size: 15px; color: #333; line-height: 1.6\">Cadena de FIV con sede en Bangalore. Respaldada por <strong style=\"color: #1a1a1a\">Vertex Ventures<\u002Fstrong> (Singapur, ronda de serie A de 5 millones de dólares). Adquirió Proactive For Her (femtech) para construir una plataforma integral de salud femenina.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<!-- INFOGRAPHIC: Country Origin of Capital -->\n<h3 id=\"where-the-capital-comes-from\" style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 18px; font-weight: 600; color: #1a1a1a; margin: 48px 0 16px\">De dónde viene el capital<\u002Fh3>\n<div class=\"wm-panel\" style=\"margin: 24px 0; padding: 40px; background: #1a1a1a; border-radius: 4px\">\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 11px; font-weight: 600; letter-spacing: 3px; text-transform: uppercase; color: #8fbc8f; margin-bottom: 28px\">Países de origen del capital riesgo sanitario<\u002Fdiv>\n<div class=\"wm-grid\" style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(265px, 100%), 1fr)); gap: 16px\">\n<div style=\"padding: 20px; background: #2a2a2a; border-radius: 4px; border-left: 4px solid #c45a3c\">\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 15px; color: #fff; font-weight: 600\">Estados Unidos<\u002Fdiv>\n<div style=\"font-family: Georgia, serif; font-size: 13px; color: #aaa; line-height: 1.5; margin-top: 8px\">Blackstone, KKR, TPG, General Atlantic, Advent International, Bain Capital<\u002Fdiv>\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 11px; color: #c45a3c; margin-top: 8px; font-weight: 600\">Mayor fuente · Controla KIMS Kerala, Care, HCG y Medicover<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"padding: 20px; background: #2a2a2a; border-radius: 4px; border-left: 4px solid #d4a574\">\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 15px; color: #fff; font-weight: 600\">Singapur<\u002Fdiv>\n<div style=\"font-family: Georgia, serif; font-size: 13px; color: #aaa; line-height: 1.5; margin-top: 8px\">Temasek Holdings, Vertex Ventures, GIC<\u002Fdiv>\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 11px; color: #d4a574; margin-top: 8px; font-weight: 600\">Más de 2.000 mill. USD solo en Manipal · Cloudnine, IVF Access<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"padding: 20px; background: #2a2a2a; border-radius: 4px; border-left: 4px solid #7a9ac4\">\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 15px; color: #fff; font-weight: 600\">Suecia<\u002Fdiv>\n<div style=\"font-family: Georgia, serif; font-size: 13px; color: #aaa; line-height: 1.5; margin-top: 8px\">EQT (antes BPEA EQT)<\u002Fdiv>\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 11px; color: #7a9ac4; margin-top: 8px; font-weight: 600\">Controla Indira IVF · Estrategia de integración en fertilidad<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"padding: 20px; background: #2a2a2a; border-radius: 4px; border-left: 4px solid #9a7abc\">\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 15px; color: #fff; font-weight: 600\">Canadá<\u002Fdiv>\n<div style=\"font-family: Georgia, serif; font-size: 13px; color: #aaa; line-height: 1.5; margin-top: 8px\">Ontario Teachers' Pension Plan<\u002Fdiv>\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 11px; color: #9a7abc; margin-top: 8px; font-weight: 600\">Antiguo propietario de Sahyadri · Vendió a Temasek/Manipal<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"padding: 20px; background: #2a2a2a; border-radius: 4px; border-left: 4px solid #7abc8a\">\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 15px; color: #fff; font-weight: 600\">Luxemburgo / Países Bajos<\u002Fdiv>\n<div style=\"font-family: Georgia, serif; font-size: 13px; color: #aaa; line-height: 1.5; margin-top: 8px\">CVC Capital Partners<\u002Fdiv>\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 11px; color: #7abc8a; margin-top: 8px; font-weight: 600\">Medanta · Vendió HCG a KKR con un retorno de 3,4×<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"padding: 20px; background: #2a2a2a; border-radius: 4px; border-left: 4px solid #bc7a7a\">\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 15px; color: #fff; font-weight: 600\">Dinamarca · Malasia · Reino Unido<\u002Fdiv>\n<div style=\"font-family: Georgia, serif; font-size: 13px; color: #aaa; line-height: 1.5; margin-top: 8px\">Novo Holdings, IHH Healthcare, Barings<\u002Fdiv>\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 11px; color: #bc7a7a; margin-top: 8px; font-weight: 600\">Manipal (minoritaria), Ujala Cygnus, pujas por Sahyadri<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<!-- PE Returns -->\n<div style=\"border-left: 3px solid #3a5a40; padding: 24px 0 24px 32px; margin: 40px 0\">\n<div style=\"font-family: Georgia, serif; font-size: clamp(1.25rem, 3.8vw, 1.75rem); line-height: 1.4; color: #1a1a1a\">KKR obtuvo un retorno de 5,6× en Max Healthcare y CVC de 3,4× en HCG. Esos retornos atraen cada vez más capital hacia los hospitales indios.<\u002Fdiv>\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 12px; color: #999; margin-top: 12px; letter-spacing: 1px; text-transform: uppercase\">Onesta Capital, Medical Buyer, 2025–26<\u002Fdiv>\n<\u002Fdiv>\n<!-- FDI NORMS -->\n<h3 id=\"fdi-norms-in-healthcare\" style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 18px; font-weight: 600; color: #1a1a1a; margin: 48px 0 16px\">Normativa de IED en sanidad<\u002Fh3>\n<p style=\"font-family: Georgia, serif; font-size: 17px; line-height: 1.8; color: #333; margin: 0 0 24px\">El marco de inversión extranjera directa en sanidad de la India es notablemente liberal. Los hospitales se abrieron al 100 % de IED por vía automática en enero de 2000, lo que convirtió al país en uno de los primeros en liberalizar por completo la inversión extranjera en infraestructura hospitalaria. La consolidación normativa de 2015-16 amplió esta apertura a los productos sanitarios y formalizó la política.<\u002Fp>\n<div style=\"margin: 32px 0; overflow-x: auto\">\n<div aria-hidden=\"true\" class=\"wm-scroll-hint\">Desplázate horizontalmente para ver todas las columnas →<\u002Fdiv><div aria-label=\"FDI caps and approval routes by healthcare sub-sector, India\" class=\"wm-table-scroll\" role=\"region\" tabindex=\"0\"><sc-raw-table style=\"width: 100%; border-collapse: collapse; font-family: 'IBM Plex Sans', sans-serif; font-size: 14px\"><sc-raw-caption>Límites de IED y vías de aprobación por subsector sanitario, India<\u002Fsc-raw-caption>\n<sc-raw-thead>\n<sc-raw-tr style=\"border-bottom: 2px solid #1a1a1a\">\n<sc-raw-th scope=\"col\" style=\"text-align: left; padding: 12px 16px 12px 0; font-weight: 600; color: #1a1a1a\">Sector<\u002Fsc-raw-th>\n<sc-raw-th scope=\"col\" style=\"text-align: center; padding: 12px 16px; font-weight: 600; color: #1a1a1a\">Límite de IED<\u002Fsc-raw-th>\n<sc-raw-th scope=\"col\" style=\"text-align: center; padding: 12px 16px; font-weight: 600; color: #1a1a1a\">Vía<\u002Fsc-raw-th>\n<sc-raw-th scope=\"col\" style=\"text-align: left; padding: 12px 0 12px 16px; font-weight: 600; color: #1a1a1a\">Notas<\u002Fsc-raw-th>\n<\u002Fsc-raw-tr>\n<\u002Fsc-raw-thead>\n<sc-raw-tbody>\n<sc-raw-tr style=\"border-bottom: 1px solid #eee\">\n<sc-raw-td data-label=\"Sector\" style=\"padding: 12px 16px 12px 0; font-weight: 500; color: #1a1a1a\">Hospitales<\u002Fsc-raw-td>\n<sc-raw-td data-label=\"FDI Cap\" style=\"padding: 12px 16px; text-align: center; color: #3a5a40; font-weight: 700\">100%<\u002Fsc-raw-td>\n<sc-raw-td data-label=\"Route\" style=\"padding: 12px 16px; text-align: center; color: #555\">Automática<\u002Fsc-raw-td>\n<sc-raw-td data-label=\"Notes\" style=\"padding: 12px 0 12px 16px; color: #555\">No requiere autorización previa del Gobierno. Desde 2000.<\u002Fsc-raw-td>\n<\u002Fsc-raw-tr>\n<sc-raw-tr style=\"border-bottom: 1px solid #eee\">\n<sc-raw-td data-label=\"Sector\" style=\"padding: 12px 16px 12px 0; font-weight: 500; color: #1a1a1a\">Diagnóstico y anatomía patológica<\u002Fsc-raw-td>\n<sc-raw-td data-label=\"FDI Cap\" style=\"padding: 12px 16px; text-align: center; color: #3a5a40; font-weight: 700\">100%<\u002Fsc-raw-td>\n<sc-raw-td data-label=\"Route\" style=\"padding: 12px 16px; text-align: center; color: #555\">Automática<\u002Fsc-raw-td>\n<sc-raw-td data-label=\"Notes\" style=\"padding: 12px 0 12px 16px; color: #555\">Se permite la propiedad extranjera total.<\u002Fsc-raw-td>\n<\u002Fsc-raw-tr>\n<sc-raw-tr style=\"border-bottom: 1px solid #eee\">\n<sc-raw-td data-label=\"Sector\" style=\"padding: 12px 16px 12px 0; font-weight: 500; color: #1a1a1a\">Productos sanitarios<\u002Fsc-raw-td>\n<sc-raw-td data-label=\"FDI Cap\" style=\"padding: 12px 16px; text-align: center; color: #3a5a40; font-weight: 700\">100%<\u002Fsc-raw-td>\n<sc-raw-td data-label=\"Route\" style=\"padding: 12px 16px; text-align: center; color: #555\">Automática<\u002Fsc-raw-td>\n<sc-raw-td data-label=\"Notes\" style=\"padding: 12px 0 12px 16px; color: #555\">Ampliado con las reformas de 2015-16.<\u002Fsc-raw-td>\n<\u002Fsc-raw-tr>\n<sc-raw-tr style=\"border-bottom: 1px solid #eee\">\n<sc-raw-td data-label=\"Sector\" style=\"padding: 12px 16px 12px 0; font-weight: 500; color: #1a1a1a\">Farmacia (obra nueva)<\u002Fsc-raw-td>\n<sc-raw-td data-label=\"FDI Cap\" style=\"padding: 12px 16px; text-align: center; color: #3a5a40; font-weight: 700\">100%<\u002Fsc-raw-td>\n<sc-raw-td data-label=\"Route\" style=\"padding: 12px 16px; text-align: center; color: #555\">Automática<\u002Fsc-raw-td>\n<sc-raw-td data-label=\"Notes\" style=\"padding: 12px 0 12px 16px; color: #555\">Nuevas plantas de fabricación.<\u002Fsc-raw-td>\n<\u002Fsc-raw-tr>\n<sc-raw-tr style=\"border-bottom: 1px solid #eee\">\n<sc-raw-td data-label=\"Sector\" style=\"padding: 12px 16px 12px 0; font-weight: 500; color: #1a1a1a\">Farmacia (activos existentes)<\u002Fsc-raw-td>\n<sc-raw-td data-label=\"FDI Cap\" style=\"padding: 12px 16px; text-align: center; color: #c45a3c; font-weight: 700\">74 % automática / 100 % con autorización<\u002Fsc-raw-td>\n<sc-raw-td data-label=\"Route\" style=\"padding: 12px 16px; text-align: center; color: #555\">Mixta<\u002Fsc-raw-td>\n<sc-raw-td data-label=\"Notes\" style=\"padding: 12px 0 12px 16px; color: #555\">Por encima del 74 % se requiere la aprobación del DPIIT. Debe mantenerse el nivel de producción.<\u002Fsc-raw-td>\n<\u002Fsc-raw-tr>\n<sc-raw-tr>\n<sc-raw-td data-label=\"Sector\" style=\"padding: 12px 16px 12px 0; font-weight: 500; color: #1a1a1a\">Seguro de salud<\u002Fsc-raw-td>\n<sc-raw-td data-label=\"FDI Cap\" style=\"padding: 12px 16px; text-align: center; color: #c45a3c; font-weight: 700\">74 % → 100 % (propuesto)<\u002Fsc-raw-td>\n<sc-raw-td data-label=\"Route\" style=\"padding: 12px 16px; text-align: center; color: #555\">Gubernamental<\u002Fsc-raw-td>\n<sc-raw-td data-label=\"Notes\" style=\"padding: 12px 0 12px 16px; color: #555\">Proyecto de ley del 100 % de IED pendiente. Las primas deben invertirse en el país.<\u002Fsc-raw-td>\n<\u002Fsc-raw-tr>\n<\u002Fsc-raw-tbody>\n<\u002Fsc-raw-table><\u002Fdiv>\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 11px; color: #999; margin-top: 12px\">Fuente: Política Consolidada de IED del DPIIT, Make in India, Startup Solicitors. Vía automática = solo notificación al RBI tras la inversión.<\u002Fdiv>\n<\u002Fdiv>\n<p style=\"font-family: Georgia, serif; font-size: 17px; line-height: 1.8; color: #333; margin: 0 0 24px\">La combinación de una IED del 100 % por vía automática en hospitales, unos retornos elevados del capital riesgo (5-6× en las mejores desinversiones), la creciente penetración del seguro y un mercado de más de 100.000 millones de dólares con baja densidad de camas ha generado lo que los inversores describen como una oportunidad de consolidación irrepetible. La cartera de salidas a bolsa —Manipal (1.170 millones de dólares), Paras y otras— indica que la próxima fase pasará por desinversiones en los mercados públicos, reciclando capital hacia la siguiente ola de adquisiciones.<\u002Fp>\n<\u002Fsection>\n<!-- SECTION 13: MARKET OUTLOOK -->\n<section aria-labelledby=\"market-outlook-heading\" id=\"market-outlook\" style=\"padding: 64px 0 0; border-top: 1px solid #e0ddd8\">\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 11px; font-weight: 600; letter-spacing: 3px; text-transform: uppercase; color: #3a5a40; margin-bottom: 16px\">13<\u002Fdiv>\n<h2 id=\"market-outlook-heading\" style=\"font-family: Georgia, serif; font-size: clamp(1.45rem, 4.8vw, 2.25rem); font-weight: 400; color: #1a1a1a; margin: 0 0 32px; line-height: 1.2\">Perspectivas del mercado y oportunidades<\u002Fh2>\n<p style=\"font-family: Georgia, serif; font-size: 17px; line-height: 1.8; color: #333; margin: 0 0 24px\">El sector hospitalario indio entra en una nueva fase de crecimiento. La próxima década estará marcada por la consolidación entre cadenas organizadas, la expansión a ciudades de segundo y tercer nivel, la eficiencia operativa impulsada por la tecnología y una combinación de pagadores en evolución a medida que se profundiza la penetración del seguro.<\u002Fp>\n<h3 id=\"key-trends\" style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 18px; font-weight: 600; color: #1a1a1a; margin: 32px 0 16px\">Tendencias clave<\u002Fh3>\n<div style=\"display: flex; flex-direction: column; gap: 12px; margin-bottom: 32px\">\n<div style=\"display: flex; gap: 12px; align-items: baseline\">\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 13px; color: #3a5a40; font-weight: 700; min-width: 20px\">→<\u002Fdiv>\n<div style=\"font-family: Georgia, serif; font-size: 16px; color: #333; line-height: 1.6\"><strong style=\"font-family: 'IBM Plex Sans', sans-serif; font-weight: 600\">La consolidación se acelera.<\u002Fstrong> Las cadenas hospitalarias están adquiriendo hospitales independientes y redes más pequeñas. Los múltiplos de valoración y el volumen de operaciones van al alza.<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; gap: 12px; align-items: baseline\">\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 13px; color: #3a5a40; font-weight: 700; min-width: 20px\">→<\u002Fdiv>\n<div style=\"font-family: Georgia, serif; font-size: 16px; color: #333; line-height: 1.6\"><strong style=\"font-family: 'IBM Plex Sans', sans-serif; font-weight: 600\">Expansión a ciudades de nivel 2 y 3.<\u002Fstrong> El crecimiento se desplaza más allá de las grandes urbes a medida que las cadenas buscan demanda sin atender y menores costes operativos.<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; gap: 12px; align-items: baseline\">\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 13px; color: #3a5a40; font-weight: 700; min-width: 20px\">→<\u002Fdiv>\n<div style=\"font-family: Georgia, serif; font-size: 16px; color: #333; line-height: 1.6\"><strong style=\"font-family: 'IBM Plex Sans', sans-serif; font-weight: 600\">Crecimiento de la consulta externa y el hospital de día.<\u002Fstrong> Cada vez más procedimientos pasan del ingreso a la consulta externa y al hospital de día, lo que transforma el diseño y la economía de los centros.<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; gap: 12px; align-items: baseline\">\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 13px; color: #3a5a40; font-weight: 700; min-width: 20px\">→<\u002Fdiv>\n<div style=\"font-family: Georgia, serif; font-size: 16px; color: #333; line-height: 1.6\"><strong style=\"font-family: 'IBM Plex Sans', sans-serif; font-weight: 600\">Integración vertical.<\u002Fstrong> Los hospitales se expanden hacia la farmacia, el diagnóstico, la atención primaria y la salud digital para capturar una mayor parte del ciclo de vida del paciente.<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; gap: 12px; align-items: baseline\">\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 13px; color: #3a5a40; font-weight: 700; min-width: 20px\">→<\u002Fdiv>\n<div style=\"font-family: Georgia, serif; font-size: 16px; color: #333; line-height: 1.6\"><strong style=\"font-family: 'IBM Plex Sans', sans-serif; font-weight: 600\">IA y automatización.<\u002Fstrong> Desde el diagnóstico hasta la interacción con el paciente y los flujos administrativos, se espera que la IA genere una reducción de costes y una mejora de la calidad relevantes.<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; gap: 12px; align-items: baseline\">\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 13px; color: #3a5a40; font-weight: 700; min-width: 20px\">→<\u002Fdiv>\n<div style=\"font-family: Georgia, serif; font-size: 16px; color: #333; line-height: 1.6\"><strong style=\"font-family: 'IBM Plex Sans', sans-serif; font-weight: 600\">Demanda impulsada por el seguro.<\u002Fstrong> A medida que se profundiza la cobertura de PMJAY y crece el seguro privado, la combinación de pagadores cambiará, creando tanto oportunidades como presión sobre los precios.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<h3 id=\"saas-technology-opportunities\" style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 18px; font-weight: 600; color: #1a1a1a; margin: 32px 0 16px\">Oportunidades en SaaS y tecnología<\u002Fh3>\n<p style=\"font-family: Georgia, serif; font-size: 17px; line-height: 1.8; color: #333; margin: 0 0 24px\">La brecha tecnológica de los hospitales indios abre oportunidades significativas para el software como servicio. La mayoría de los centros sigue dependiendo de sistemas fragmentados con escasa integración, procesos manuales y analítica limitada. Entre las áreas de mayor valor destacan:<\u002Fp>\n<div class=\"wm-grid\" style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(265px, 100%), 1fr)); gap: 16px; margin: 16px 0\">\n<div style=\"padding: 20px; border: 1px solid #e0ddd8; border-radius: 4px\">\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; font-weight: 600; color: #1a1a1a; margin-bottom: 6px\">Captación de pacientes y CRM<\u002Fdiv>\n<div style=\"font-family: Georgia, serif; font-size: 14px; color: #666; line-height: 1.5\">Gestión de oportunidades, seguimiento de conversiones, automatización del seguimiento y gestión del ciclo de vida del paciente.<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"padding: 20px; border: 1px solid #e0ddd8; border-radius: 4px\">\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; font-weight: 600; color: #1a1a1a; margin-bottom: 6px\">Gestión del ciclo de ingresos<\u002Fdiv>\n<div style=\"font-family: Georgia, serif; font-size: 14px; color: #666; line-height: 1.5\">Tramitación de reclamaciones al seguro, automatización de la facturación y detección de fugas de ingresos.<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"padding: 20px; border: 1px solid #e0ddd8; border-radius: 4px\">\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; font-weight: 600; color: #1a1a1a; margin-bottom: 6px\">Interacción con el paciente<\u002Fdiv>\n<div style=\"font-family: Georgia, serif; font-size: 14px; color: #666; line-height: 1.5\">Comunicación por WhatsApp y SMS, recordatorios de cita, seguimiento tras el alta y adherencia al tratamiento.<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"padding: 20px; border: 1px solid #e0ddd8; border-radius: 4px\">\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; font-weight: 600; color: #1a1a1a; margin-bottom: 6px\">Analítica operativa<\u002Fdiv>\n<div style=\"font-family: Georgia, serif; font-size: 14px; color: #666; line-height: 1.5\">Optimización del uso de camas, programación de quirófanos, aprovechamiento de agendas médicas, predicción de ausencias y planificación de capacidad.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n<!-- SECTION 14: SOURCES -->\n<section aria-labelledby=\"faq-heading\" id=\"faq\" style=\"padding: 56px 0; border-bottom: 1px solid #e0ddd8\">\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 11px; font-weight: 600; letter-spacing: 3px; text-transform: uppercase; color: #3a5a40; margin-bottom: 24px\">Preguntas frecuentes<\u002Fdiv>\n<h2 id=\"faq-heading\" style=\"font-family: Georgia, 'Times New Roman', serif; font-weight: 400;\n             font-size: clamp(1.45rem, 4.8vw, 2.25rem); color: #1a1a1a; margin: 0 0 8px;\n             line-height: 1.2\">\n    Preguntas habituales sobre el sector hospitalario indio\n  <\u002Fh2>\n<div style=\"margin-top: 24px\"><div class=\"wm-faq-item\">\n<h3 class=\"wm-faq-q\" id=\"faq-1\">¿Qué tamaño tiene el sector hospitalario indio?<\u002Fh3>\n<p class=\"wm-faq-a\">El mercado hospitalario indio valía unos 104.000 millones de dólares en 2025, frente a unos 99.000 millones en 2023, y crece entre un 7 % y un 8 % anual. Las previsiones varían según el alcance y la metodología: IBEF/IMARC proyectan un aumento de 193.000 millones en 2025 a 365.000 millones en 2034, mientras que Ken Research prevé pasar de 124.000 a 197.000 millones en 2031.<\u002Fp>\n<\u002Fdiv><div class=\"wm-faq-item\">\n<h3 class=\"wm-faq-q\" id=\"faq-2\">¿Cuántos hospitales y camas hospitalarias tiene la India?<\u002Fh3>\n<p class=\"wm-faq-a\">La India cuenta con unos 54.000 hospitales y 1,3 millones de camas, frente a 43.500 hospitales y 1,1 millones de camas en 2019. Cerca de 38.000 son privados (en torno al 70 % de los centros) y unos 16.000 públicos. Con las camas ocurre lo contrario: los hospitales públicos concentran más de 710.000 camas (55 %) frente a unas 590.000 en manos privadas.<\u002Fp>\n<\u002Fdiv><div class=\"wm-faq-item\">\n<h3 class=\"wm-faq-q\" id=\"faq-3\">¿Cómo se compara la densidad de camas de la India con la de otros países?<\u002Fh3>\n<p class=\"wm-faq-a\">La India tiene unas 1,3 camas por cada 1.000 habitantes, frente a una mediana mundial de 2,9. Solo las camas públicas suponen 0,79 por cada 1.000, por debajo del objetivo de 2,0 de la Política Nacional de Salud de 2017. Japón se sitúa en 13,0, Corea del Sur en 12,6, China en 6,4 y Estados Unidos en 2,9. Cerrar la brecha hasta la mediana mundial exigiría unos 2,4 millones de camas adicionales.<\u002Fp>\n<\u002Fdiv><div class=\"wm-faq-item\">\n<h3 class=\"wm-faq-q\" id=\"faq-4\">¿Cuáles son las mayores cadenas hospitalarias de la India?<\u002Fh3>\n<p class=\"wm-faq-a\">Por número de camas, Manipal Hospitals lidera con 13.037 camas y unos ingresos de 10.336 millones de rupias, seguida de Apollo Hospitals con 10.209 camas y 21.794 millones de rupias de ingresos en el ejercicio 2025, la mayor por facturación. KIMS supera las 8.000 camas, Narayana Health tiene 6.100, Fortis 5.554, Aster DM 5.449, Max Healthcare unas 5.000 y Medanta más de 2.800.<\u002Fp>\n<\u002Fdiv><div class=\"wm-faq-item\">\n<h3 class=\"wm-faq-q\" id=\"faq-5\">¿Qué es el ARPOB y qué cadena hospitalaria india tiene el más alto?<\u002Fh3>\n<p class=\"wm-faq-a\">ARPOB son las siglas en inglés de ingreso medio por cama ocupada y día, la medida estándar del poder de fijación de precios y de la calidad de la casuística en la gestión hospitalaria. Max Healthcare lidera con unas 77.800 rupias diarias, por delante de Fortis con 68.800, Manipal con 66.144 y Apollo con 60.588. Los operadores basados en volumen, como KIMS, se sitúan más abajo, en 39.158 rupias.<\u002Fp>\n<\u002Fdiv><div class=\"wm-faq-item\">\n<h3 class=\"wm-faq-q\" id=\"faq-6\">¿Qué márgenes EBITDA obtienen los hospitales indios?<\u002Fh3>\n<p class=\"wm-faq-a\">Según India Ratings, se prevén márgenes EBITDA del 20,9 % para todo el sector en el ejercicio 2026. Max Healthcare lidera con cerca del 35 %, seguida de Medanta con un 28 % aproximado, Manipal y KIMS en torno al 26 %, Narayana con un 25 %, Fortis con un 22 % y Apollo y Aster DM alrededor del 20 %. La madurez importa: los hospitales con más de siete años suelen ofrecer entre un 22 % y un 25 %, mientras que los nuevos aún en rodaje se quedan por debajo del 10 %.<\u002Fp>\n<\u002Fdiv><div class=\"wm-faq-item\">\n<h3 class=\"wm-faq-q\" id=\"faq-7\">¿Qué tasas de ocupación registran las cadenas hospitalarias indias?<\u002Fh3>\n<p class=\"wm-faq-a\">La ocupación se sitúa por lo general en una franja del 60 % al 75 %. Max Healthcare alcanza la más alta con un 76 %, seguida de Narayana y Fortis con un 68 %, Apollo con un 67 %, KIMS en torno al 65 %, Manipal con un 64 %, Medanta con un 62 % y Aster DM con un 61 %. Dado que los costes hospitalarios son en gran medida fijos, cada punto de ocupación por encima del 65 % aproximadamente aporta de forma desproporcionada al margen.<\u002Fp>\n<\u002Fdiv><div class=\"wm-faq-item\">\n<h3 class=\"wm-faq-q\" id=\"faq-8\">¿Se permite el 100 % de IED en los hospitales indios?<\u002Fh3>\n<p class=\"wm-faq-a\">Sí. Los hospitales admiten inversión extranjera directa del 100 % por vía automática desde enero de 2000, sin necesidad de autorización previa del Gobierno. El diagnóstico, la anatomía patológica, los productos sanitarios y la farmacia de obra nueva también permiten el 100 % por esta vía. La farmacia sobre activos existentes está limitada al 74 % automático, y el seguro de salud al 74 %, con una propuesta para elevarlo al 100 %.<\u002Fp>\n<\u002Fdiv><div class=\"wm-faq-item\">\n<h3 class=\"wm-faq-q\" id=\"faq-9\">¿Cuánto capital riesgo ha entrado en la sanidad india?<\u002Fh3>\n<p class=\"wm-faq-a\">Los fondos globales de capital riesgo y soberanos invirtieron 15.500 millones de dólares en la sanidad india entre 2019 y 2024, con un máximo de 5.500 millones en 2023. Los hospitales absorbieron el 68 % de ese capital, incluidos 4.960 millones entre 2022 y 2024. Casi la mitad de las principales cadenas hospitalarias del país están hoy en manos de capital riesgo internacional, y desinversiones como el 5,6× de KKR en Max Healthcare o el 3,4× de CVC en HCG siguen atrayendo capital.<\u002Fp>\n<\u002Fdiv><div class=\"wm-faq-item\">\n<h3 class=\"wm-faq-q\" id=\"faq-10\">¿Qué tamaño tiene el mercado del turismo médico en la India?<\u002Fh3>\n<p class=\"wm-faq-a\">El mercado indio de turismo médico valía unos 7.690 millones de dólares en 2024 y se prevé que crezca a más del 13 % anual compuesto. Las llegadas de pacientes extranjeros para tratamiento pasaron de 182.945 en 2020 a 644.387 en 2024. La ventaja principal es el precio: los tratamientos cuestan entre el 10 % y el 20 % de sus equivalentes occidentales, con una cirugía de baipás coronario en torno a 7.000 dólares en la India frente a 123.000 en Estados Unidos y 64.000 en el Reino Unido.<\u002Fp>\n<\u002Fdiv><div class=\"wm-faq-item\">\n<h3 class=\"wm-faq-q\" id=\"faq-11\">¿Cuántos indios tienen cobertura sanitaria?<\u002Fh3>\n<p class=\"wm-faq-a\">Alrededor del 60 % de la población cuenta con cobertura neta única. Ayushman Bharat cubre a unos 550 millones de personas, los programas estatales a otros 250 millones y el seguro privado a unos 200 millones, con un solapamiento notable entre ellos. Cerca de 400 millones de indios siguen sin seguro. El gasto de bolsillo ha caído con fuerza, del 64,2 % del gasto sanitario en el ejercicio 2015 al 39,4 % en el de 2022.<\u002Fp>\n<\u002Fdiv><div class=\"wm-faq-item\">\n<h3 class=\"wm-faq-q\" id=\"faq-12\">¿Cuánto cuesta poner en marcha un hospital en la India?<\u002Fh3>\n<p class=\"wm-faq-a\">La economía de la puesta en marcha depende de la inversión de capital por cama, que varía mucho según el nivel de la ciudad y la complejidad asistencial. La inversión de capital cubre el suelo, la construcción, el equipamiento médico y la instalación, mientras que el gasto operativo está dominado por el personal, los consumibles y la farmacia. Los hospitales nuevos suelen registrar márgenes EBITDA inferiores al 10 % hasta alcanzar la madurez, y el punto de equilibrio depende de la rapidez con que suba la ocupación.<\u002Fp>\n<\u002Fdiv><\u002Fdiv>\n<\u002Fsection>\n<section aria-labelledby=\"wisemelon-platform-heading\" id=\"wisemelon-platform\" style=\"padding: 64px 0 0\">\n<div style=\"background: #1a1a1a; border-radius: 4px; padding: clamp(28px, 5vw, 52px)\">\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 11px; font-weight: 600;\n                letter-spacing: 3px; text-transform: uppercase; color: #8fbc8f; margin-bottom: 20px\">\n      De la editorial\n    <\u002Fdiv>\n<h2 id=\"wisemelon-platform-heading\" style=\"font-family: Georgia, 'Times New Roman', serif; font-weight: 400;\n               font-size: clamp(1.45rem, 4.6vw, 2.125rem); color: #ffffff; margin: 0 0 18px;\n               line-height: 1.2; max-width: 620px\">\n      Este informe apunta una y otra vez a la misma carencia. Nosotros construimos lo que la cubre.\n    <\u002Fh2>\n<p style=\"font-family: Georgia, serif; font-size: 17px; line-height: 1.7; color: #b8b3ab;\n              margin: 0 0 34px; max-width: 620px\">\n      Wisemelon opera <strong style=\"color: #ffffff; font-weight: 400\">Gestión Inteligente del Recorrido del Paciente<\u002Fstrong> : una única plataforma de IA que cubre todo el recorrido, desde el primer contacto en la web, las redes sociales o WhatsApp hasta la atención de por vida. Los sistemas fragmentados, el seguimiento manual y los abandonos invisibles son la razón por la que los hospitales pierden ingresos en cada una de las etapas anteriores.\n    <\u002Fp>\n<div class=\"wm-grid\" style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(300px, 100%), 1fr));\n                gap: 26px 40px; padding: 30px 0; border-top: 1px solid #333;\n                border-bottom: 1px solid #333; margin-bottom: 34px\">\n<div>\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 15px; font-weight: 600;\n                    color: #ffffff; margin-bottom: 6px; line-height: 1.35\">Reserva en 30 segundos<\u002Fdiv>\n<div style=\"font-family: 'IBM Plex Sans',
