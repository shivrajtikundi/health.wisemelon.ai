<p style=\"font-family: Georgia, serif; font-size: 17px; line-height: 1.8; color: #333; margin: 0 0 24px\">Las especialidades clínicas de alta complejidad —conocidas en conjunto como CONGO-R (cardiología, oncología, neurociencias, gastroenterología, traumatología y nefrología)— generan ya la mayor parte de los ingresos hospitalarios. En el ejercicio 2025 aportaron el 68 % del mercado de prestación sanitaria. El giro hacia la atención compleja y crónica es estructural: a medida que la carga de enfermedad de la India pasa de las infecciosas a las no transmisibles, los ingresos hospitalarios siguen el mismo camino.<\u002Fp>\n<!-- INFOGRAPHIC: CONGO-R dominance -->\n<div class=\"wm-panel\" style=\"margin: 40px 0; padding: 40px; background: #1a1a1a; border-radius: 4px\">\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 11px; font-weight: 600; letter-spacing: 3px; text-transform: uppercase; color: #8fbc8f; margin-bottom: 8px\">Aportación a los ingresos por grupo de especialidad<\u002Fdiv>\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 12px; color: #666; margin-bottom: 24px\">Porcentaje de los ingresos hospitalarios · ej. 2025<\u002Fdiv>\n<div style=\"display: flex; height: 56px; border-radius: 4px; overflow: hidden; margin-bottom: 20px\">\n<div style=\"width: 22%; background: #c45a3c; display: flex; align-items: center; justify-content: center; padding: 0 4px\">\n<span style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 11px; color: #fff; font-weight: 600; text-align: center\">Cardio<br/>22%<\u002Fspan>\n<\u002Fdiv>\n<div style=\"width: 16%; background: #d4725a; display: flex; align-items: center; justify-content: center; padding: 0 4px\">\n<span style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 11px; color: #fff; font-weight: 600; text-align: center\">Onco<br/>16%<\u002Fspan>\n<\u002Fdiv>\n<div style=\"width: 10%; background: #3a5a40; display: flex; align-items: center; justify-content: center; padding: 0 4px\">\n<span style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 10px; color: #fff; font-weight: 600; text-align: center\">Neuro<br/>10%<\u002Fspan>\n<\u002Fdiv>\n<div style=\"width: 8%; background: #4a6a50; display: flex; align-items: center; justify-content: center; padding: 0 4px\">\n<span style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 10px; color: #fff; font-weight: 600; text-align: center\">Gastro<br/>8%<\u002Fspan>\n<\u002Fdiv>\n<div style=\"width: 7%; background: #5a7a60; display: flex; align-items: center; justify-content: center; padding: 0 2px\">\n<span style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 9px; color: #fff; font-weight: 600; text-align: center\">Trauma<br/>7%<\u002Fspan>\n<\u002Fdiv>\n<div style=\"width: 5%; background: #6a8a70; display: flex; align-items: center; justify-content: center\">\n<span style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 9px; color: #fff; font-weight: 600\">R<\u002Fspan>\n<\u002Fdiv>\n<div style=\"width: 32%; background: #555; display: flex; align-items: center; justify-content: center\">\n<span style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 11px; color: #fff; font-weight: 600\">General y otros 32 %<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; gap: 16px; flex-wrap: wrap\">\n<div style=\"display: flex; align-items: center; gap: 6px\"><div style=\"width: 24px; height: 4px; background: #c45a3c; border-radius: 2px\"><\u002Fdiv><span style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 11px; color: #888\">Especialidades CONGO-R: 68 %<\u002Fspan><\u002Fdiv>\n<div style=\"display: flex; align-items: center; gap: 6px\"><div style=\"width: 24px; height: 4px; background: #555; border-radius: 2px\"><\u002Fdiv><span style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 11px; color: #888\">Medicina general, cirugía y otros: 32 %<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<!-- INFOGRAPHIC: Specialty Growth Rates -->\n<div class=\"wm-panel\" style=\"margin: 48px 0; padding: 40px; background: #f0eeea; border-radius: 4px\">\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 11px; font-weight: 600; letter-spacing: 3px; text-transform: uppercase; color: #3a5a40; margin-bottom: 8px\">Crecimiento de ingresos por especialidad<\u002Fdiv>\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 12px; color: #999; margin-bottom: 24px\">Crecimiento interanual ej. 2026 · principales cadenas<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 12px\">\n<div style=\"display: flex; align-items: center; gap: 12px\">\n<div class=\"wm-chart-label\" style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 12px; color: #555; width: 110px; text-align: right; flex-shrink: 0\">Oncología<\u002Fdiv>\n<div style=\"flex: 1; display: flex; align-items: center; gap: 8px\">\n<div style=\"height: 24px; background: #c45a3c; border-radius: 3px; width: 92%\"><\u002Fdiv>\n<span style=\"font-family: Georgia, serif; font-size: 15px; color: #c45a3c; font-weight: 700\">23%<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; align-items: center; gap: 12px\">\n<div class=\"wm-chart-label\" style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 12px; color: #555; width: 110px; text-align: right; flex-shrink: 0\">Cardiología<\u002Fdiv>\n<div style=\"flex: 1; display: flex; align-items: center; gap: 8px\">\n<div style=\"height: 24px; background: #c45a3c; border-radius: 3px; width: 84%\"><\u002Fdiv>\n<span style=\"font-family: Georgia, serif; font-size: 15px; color: #c45a3c; font-weight: 700\">~20%<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; align-items: center; gap: 12px\">\n<div class=\"wm-chart-label\" style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 12px; color: #555; width: 110px; text-align: right; flex-shrink: 0\">Neurociencias<\u002Fdiv>\n<div style=\"flex: 1; display: flex; align-items: center; gap: 8px\">\n<div style=\"height: 24px; background: #3a5a40; border-radius: 3px; width: 72%\"><\u002Fdiv>\n<span style=\"font-family: Georgia, serif; font-size: 15px; color: #3a5a40; font-weight: 700\">~18%<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; align-items: center; gap: 12px\">\n<div class=\"wm-chart-label\" style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 12px; color: #555; width: 110px; text-align: right; flex-shrink: 0\">Nefrología<\u002Fdiv>\n<div style=\"flex: 1; display: flex; align-items: center; gap: 8px\">\n<div style=\"height: 24px; background: #3a5a40; border-radius: 3px; width: 68%\"><\u002Fdiv>\n<span style=\"font-family: Georgia, serif; font-size: 15px; color: #3a5a40; font-weight: 700\">~17%<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; align-items: center; gap: 12px\">\n<div class=\"wm-chart-label\" style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 12px; color: #555; width: 110px; text-align: right; flex-shrink: 0\">Traumatología<\u002Fdiv>\n<div style=\"flex: 1; display: flex; align-items: center; gap: 8px\">\n<div style=\"height: 24px; background: #4a6a50; border-radius: 3px; width: 64%\"><\u002Fdiv>\n<span style=\"font-family: Georgia, serif; font-size: 15px; color: #4a6a50; font-weight: 700\">~16%<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; align-items: center; gap: 12px\">\n<div class=\"wm-chart-label\" style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 12px; color: #555; width: 110px; text-align: right; flex-shrink: 0\">Gastroenterología<\u002Fdiv>\n<div style=\"flex: 1; display: flex; align-items: center; gap: 8px\">\n<div style=\"height: 24px; background: #5a7a60; border-radius: 3px; width: 56%\"><\u002Fdiv>\n<span style=\"font-family: Georgia, serif; font-size: 15px; color: #5a7a60; font-weight: 700\">~14%<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; align-items: center; gap: 12px\">\n<div class=\"wm-chart-label\" style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 12px; color: #555; width: 110px; text-align: right; flex-shrink: 0; font-style: italic\">Hospital en conjunto<\u002Fdiv>\n<div style=\"flex: 1; display: flex; align-items: center; gap: 8px\">\n<div style=\"height: 24px; background: #999; border-radius: 3px; width: 60%; border: 2px dashed #777; box-sizing: border-box\"><\u002Fdiv>\n<span style=\"font-family: Georgia, serif; font-size: 15px; color: #999; font-weight: 700\">~15%<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 11px; color: #999; margin-top: 16px\">Fuentes: boletín EY Healthcare T4 ej. 2026 y cuentas de Aster DM, Fortis y Apollo. La oncología y la cardiología superan sistemáticamente el crecimiento global de los ingresos hospitalarios.<\u002Fdiv>\n<\u002Fdiv>\n<!-- INFOGRAPHIC: Chain-Specific Specialty Mix -->\n<div class=\"wm-panel\" style=\"margin: 48px 0; padding: 40px; background: #1a1a1a; border-radius: 4px\">\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 11px; font-weight: 600; letter-spacing: 3px; text-transform: uppercase; color: #8fbc8f; margin-bottom: 28px\">Peso de CONGO-R en los ingresos por cadena<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 16px\">\n<div>\n<div style=\"display: flex; justify-content: space-between; margin-bottom: 6px\">\n<span style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 13px; color: #fff; font-weight: 500\">Manipal Hospitals<\u002Fspan>\n<span style=\"font-family: Georgia, serif; font-size: 15px; color: #8fbc8f; font-weight: 700\">64%<\u002Fspan>\n<\u002Fdiv>\n<div style=\"height: 16px; background: #2a2a2a; border-radius: 3px; overflow: hidden\">\n<div style=\"width: 64%; height: 100%; background: linear-gradient(90deg, #3a5a40, #5a7a60); border-radius: 3px\"><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div>\n<div style=\"display: flex; justify-content: space-between; margin-bottom: 6px\">\n<span style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 13px; color: #fff; font-weight: 500\">Apollo Hospitals<\u002Fspan>\n<span style=\"font-family: Georgia, serif; font-size: 15px; color: #8fbc8f; font-weight: 700\">60%<\u002Fspan>\n<\u002Fdiv>\n<div style=\"height: 16px; background: #2a2a2a; border-radius: 3px; overflow: hidden\">\n<div style=\"width: 60%; height: 100%; background: linear-gradient(90deg, #3a5a40, #5a7a60); border-radius: 3px\"><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div>\n<div style=\"display: flex; justify-content: space-between; margin-bottom: 6px\">\n<span style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 13px; color: #fff; font-weight: 500\">Aster DM<\u002Fspan>\n<span style=\"font-family: Georgia, serif; font-size: 15px; color: #8fbc8f; font-weight: 700\">58%<\u002Fspan>\n<\u002Fdiv>\n<div style=\"height: 16px; background: #2a2a2a; border-radius: 3px; overflow: hidden\">\n<div style=\"width: 58%; height: 100%; background: linear-gradient(90deg, #3a5a40, #5a7a60); border-radius: 3px\"><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div>\n<div style=\"display: flex; justify-content: space-between; margin-bottom: 6px\">\n<span style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 13px; color: #fff; font-weight: 500\">Fortis Healthcare<\u002Fspan>\n<span style=\"font-family: Georgia, serif; font-size: 15px; color: #8fbc8f; font-weight: 700\">~55%<\u002Fspan>\n<\u002Fdiv>\n<div style=\"height: 16px; background: #2a2a2a; border-radius: 3px; overflow: hidden\">\n<div style=\"width: 55%; height: 100%; background: linear-gradient(90deg, #3a5a40, #5a7a60); border-radius: 3px\"><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 11px; color: #555; margin-top: 16px\">Apollo aspira a que CONGO represente el 65 % en los próximos trimestres. El folleto de salida a bolsa de Manipal del ejercicio 2026 reveló la mayor concentración en CONGO-R.<\u002Fdiv>\n<\u002Fdiv>\n<!-- Specialty Deep Dive Cards -->\n<h3 id=\"specialty-deep-dive\" style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 18px; font-weight: 600; color: #1a1a1a; margin: 48px 0 16px\">Análisis por especialidad<\u002Fh3>\n<div class=\"wm-grid\" style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(265px, 100%), 1fr)); gap: 16px; margin: 24px 0\">\n<div style=\"padding: 24px; border: 1px solid #e0ddd8; border-radius: 4px; border-top: 3px solid #c45a3c\">\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; font-weight: 700; color: #1a1a1a; margin-bottom: 8px\">Cardiología<\u002Fdiv>\n<div style=\"font-family: Georgia, serif; font-size: 14px; color: #555; line-height: 1.6\">La mayor especialidad individual. Supone el 22,5 % de los ingresos por turismo médico. Las enfermedades cardiovasculares afectan al 37 % de los indios mayores de 75 años. La cirugía cardíaca robótica crece un 15-20 % anual. Narayana construyó su marca sobre la cardiología de alto volumen.<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"padding: 24px; border: 1px solid #e0ddd8; border-radius: 4px; border-top: 3px solid #c45a3c\">\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; font-weight: 700; color: #1a1a1a; margin-bottom: 8px\">Oncología<\u002Fdiv>\n<div style=\"font-family: Georgia, serif; font-size: 14px; color: #555; line-height: 1.6\">La gran especialidad de mayor crecimiento (23 % interanual). En Aster DM, cardiología y oncología suman en torno al 25 % de los ingresos. Apollo invierte 80 millones de rupias en tratamiento oncológico con IA. HCG, participada por KKR, es la mayor cadena oncológica del país.<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"padding: 24px; border: 1px solid #e0ddd8; border-radius: 4px; border-top: 3px solid #3a5a40\">\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; font-weight: 700; color: #1a1a1a; margin-bottom: 8px\">Neurociencias<\u002Fdiv>\n<div style=\"font-family: Georgia, serif; font-size: 14px; color: #555; line-height: 1.6\">Demanda al alza impulsada por ictus, columna y neurooncología. Apollo invierte explícitamente en neurociencias como pilar de crecimiento. Los casos complejos generan un ARPOB superior.<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"padding: 24px; border: 1px solid #e0ddd8; border-radius: 4px; border-top: 3px solid #3a5a40\">\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; font-weight: 700; color: #1a1a1a; margin-bottom: 8px\">Traumatología<\u002Fdiv>\n<div style=\"font-family: Georgia, serif; font-size: 14px; color: #555; line-height: 1.6\">La cirugía protésica y de columna son grandes reclamos del turismo médico. La cirugía asistida por robot (da Vinci, Mako) se extiende en las grandes cadenas. El envejecimiento poblacional acelera la demanda.<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"padding: 24px; border: 1px solid #e0ddd8; border-radius: 4px; border-top: 3px solid #5a7a60\">\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; font-weight: 700; color: #1a1a1a; margin-bottom: 8px\">Nefrología<\u002Fdiv>\n<div style=\"font-family: Georgia, serif; font-size: 14px; color: #555; line-height: 1.6\">Las cadenas de diálisis crecen con rapidez. Los programas de trasplante se amplían en KIMS, Apollo y Medanta. La prevalencia de enfermedad renal crónica aumenta con la epidemia de diabetes.<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"padding: 24px; border: 1px solid #e0ddd8; border-radius: 4px; border-top: 3px solid #5a7a60\">\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; font-weight: 700; color: #1a1a1a; margin-bottom: 8px\">Fertilidad y salud de la mujer<\u002Fdiv>\n<div style=\"font-family: Georgia, serif; font-size: 14px; color: #555; line-height: 1.6\">El vertical que más rápido se consolida. El mercado indio de FIV crece un 15-20 % anual. Las integraciones respaldadas por capital riesgo (Indira IVF, Cloudnine) impulsan el formato de cadena. Hay actividad en bolsa (Gaudium IVF, febrero de 2026).<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"border-left: 3px solid #3a5a40; padding: 24px 0 24px 32px; margin: 40px 0\">\n<div style=\"font-family: Georgia, serif; font-size: clamp(1.25rem, 3.8vw, 1.75rem); line-height: 1.4; color: #1a1a1a\">La atención especializada aporta el 60 % de los ingresos de Apollo y se espera que suba al 65 %. Todo el sector está virando hacia la atención compleja y de alto ARPOB.<\u002Fdiv>\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 12px; color: #999; margin-top: 12px; letter-spacing: 1px; text-transform: uppercase\">Consejero delegado de Apollo Hospitals, Reuters, ej. 2026<\u002Fdiv>\n<\u002Fdiv>\n<!-- Medical Tourism by Specialty -->\n<div class=\"wm-panel\" style=\"margin: 40px 0; padding: 40px; background: #f0eeea; border-radius: 4px\">\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 11px; font-weight: 600; letter-spacing: 3px; text-transform: uppercase; color: #3a5a40; margin-bottom: 8px\">Ingresos de turismo médico por especialidad<\u002Fdiv>\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 12px; color: #999; margin-bottom: 24px\">Porcentaje de ingresos de pacientes internacionales · 2024<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 10px\">\n<div style=\"display: flex; align-items: center; gap: 12px\">\n<div class=\"wm-chart-label\" style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 12px; color: #555; width: 100px; text-align: right; flex-shrink: 0\">Cardiovascular<\u002Fdiv>\n<div style=\"flex: 1; display: flex; align-items: center; gap: 8px\">\n<div style=\"height: 22px; background: #c45a3c; border-radius: 3px; width: 90%\"><\u002Fdiv>\n<span style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 13px; color: #1a1a1a; font-weight: 600\">22.5%<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; align-items: center; gap: 12px\">\n<div class=\"wm-chart-label\" style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 12px; color: #555; width: 100px; text-align: right; flex-shrink: 0\">Oncología<\u002Fdiv>\n<div style=\"flex: 1; display: flex; align-items: center; gap: 8px\">\n<div style=\"height: 22px; background: #3a5a40; border-radius: 3px; width: 72%\"><\u002Fdiv>\n<span style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 13px; color: #1a1a1a; font-weight: 600\">~18%<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; align-items: center; gap: 12px\">\n<div class=\"wm-chart-label\" style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 12px; color: #555; width: 100px; text-align: right; flex-shrink: 0\">Traumatología<\u002Fdiv>\n<div style=\"flex: 1; display: flex; align-items: center; gap: 8px\">\n<div style=\"height: 22px; background: #4a6a50; border-radius: 3px; width: 60%\"><\u002Fdiv>\n<span style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 13px; color: #1a1a1a; font-weight: 600\">~15%<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; align-items: center; gap: 12px\">\n<div class=\"wm-chart-label\" style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 12px; color: #555; width: 100px; text-align: right; flex-shrink: 0\">Trasplantes<\u002Fdiv>\n<div style=\"flex: 1; display: flex; align-items: center; gap: 8px\">\n<div style=\"height: 22px; background: #5a7a60; border-radius: 3px; width: 48%\"><\u002Fdiv>\n<span style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 13px; color: #1a1a1a; font-weight: 600\">~12%<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; align-items: center; gap: 12px\">\n<div class=\"wm-chart-label\" style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 12px; color: #555; width: 100px; text-align: right; flex-shrink: 0\">Fertilidad / FIV<\u002Fdiv>\n<div style=\"flex: 1; display: flex; align-items: center; gap: 8px\">\n<div style=\"height: 22px; background: #6a8a70; border-radius: 3px; width: 40%\"><\u002Fdiv>\n<span style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 13px; color: #1a1a1a; font-weight: 600\">~10%<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; align-items: center; gap: 12px\">\n<div class=\"wm-chart-label\" style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 12px; color: #555; width: 100px; text-align: right; flex-shrink: 0\">Dental / otros<\u002Fdiv>\n<div style=\"flex: 1; display: flex; align-items: center; gap: 8px\">\n<div style=\"height: 22px; background: #999; border-radius: 3px; width: 90%\"><\u002Fdiv>\n<span style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 13px; color: #1a1a1a; font-weight: 600\">~22.5%<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<p style=\"font-family: Georgia, serif; font-size: 17px; line-height: 1.8; color: #333; margin: 0 0 24px\">La combinación de ingresos está cambiando deprisa. Los hospitales que invirtieron pronto en oncología, neurociencias y programas de trasplante destacan en ARPOB. El giro del sector hacia las especialidades CONGO-R responde tanto a la demanda (creciente carga de enfermedades no transmisibles, envejecimiento) como a la oferta (estos servicios generan entre dos y tres veces el ARPOB de la medicina general). Con el 83 % de las muertes por enfermedades no transmisibles atribuibles a cuatro grandes grupos, este cambio estructural tiene décadas de recorrido.<\u002Fp>\n<\u002Fsection>\n<!-- SECTION 06: SETUP vs OPERATIONAL COSTS -->\n<section aria-labelledby=\"setup-vs-operating-costs-heading\" id=\"setup-vs-operating-costs\" style=\"padding: 64px 0 0; border-top: 1px solid #e0ddd8\">\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 11px; font-weight: 600; letter-spacing: 3px; text-transform: uppercase; color: #3a5a40; margin-bottom: 16px\">06<\u002Fdiv>\n<h2 id=\"setup-vs-operating-costs-heading\" style=\"font-family: Georgia, serif; font-size: clamp(1.45rem, 4.8vw, 2.25rem); font-weight: 400; color: #1a1a1a; margin: 0 0 32px; line-height: 1.2\">Costes de puesta en marcha frente a operativos<\u002Fh2>\n<p style=\"font-family: Georgia, serif; font-size: 17px; line-height: 1.8; color: #333; margin: 0 0 24px\">Construir un hospital en la India exige un capital inicial considerable, pero es el gasto operativo continuo el que determina en última instancia la viabilidad a largo plazo. La economía difiere notablemente entre las grandes metrópolis y las ciudades de segundo y tercer nivel, y entre el posicionamiento económico y el premium.<\u002Fp>\n<!-- INFOGRAPHIC: Per-Bed Setup Cost Range -->\n<div class=\"wm-panel\" style=\"margin: 40px 0; padding: 40px; background: #1a1a1a; border-radius: 4px\">\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 11px; font-weight: 600; letter-spacing: 3px; text-transform: uppercase; color: #8fbc8f; margin-bottom: 28px\">Coste de puesta en marcha por cama (lakhs de ₹)<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 20px\">\n<div>\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 13px; color: #999; margin-bottom: 8px\">Económico / ciudades de nivel 2-3 (p. ej. el modelo Ujala Cygnus)<\u002Fdiv>\n<div style=\"height: 36px; background: #2a2a2a; border-radius: 3px; overflow: hidden; position: relative\">\n<div style=\"position: absolute; left: 11.1%; width: 5.5%; height: 100%; background: #3a5a40; border-radius: 3px; display: flex; align-items: center; justify-content: center\">\n<\u002Fdiv>\n<div style=\"position: absolute; left: 11.1%; top: -2px; font-family: 'IBM Plex Sans', sans-serif; font-size: 11px; color: #8fbc8f; transform: translateY(-100%)\">₹10L<\u002Fdiv>\n<div style=\"position: absolute; left: 16.6%; top: -2px; font-family: 'IBM Plex Sans', sans-serif; font-size: 11px; color: #8fbc8f; transform: translateY(-100%)\">₹15L<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div>\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 13px; color: #999; margin-bottom: 8px\">Hospital metropolitano estándar<\u002Fdiv>\n<div style=\"height: 36px; background: #2a2a2a; border-radius: 3px; overflow: hidden; position: relative\">\n<div style=\"position: absolute; left: 55.5%; width: 44.5%; height: 100%; background: #c45a3c; border-radius: 3px; opacity: 0.85\"><\u002Fdiv>\n<div style=\"position: absolute; left: 55.5%; top: -2px; font-family: 'IBM Plex Sans', sans-serif; font-size: 11px; color: #c45a3c; transform: translateY(-100%)\">₹50L<\u002Fdiv>\n<div style=\"position: absolute; right: 0; top: -2px; font-family: 'IBM Plex Sans', sans-serif; font-size: 11px; color: #c45a3c; transform: translateY(-100%)\">₹90L<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div>\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 13px; color: #999; margin-bottom: 8px\">Premium / superespecializado<\u002Fdiv>\n<div style=\"height: 36px; background: #2a2a2a; border-radius: 3px; overflow: hidden; position: relative\">\n<div style=\"position: absolute; left: 77.7%; width: 22.3%; height: 100%; background: #8b3a2a; border-radius: 3px\"><\u002Fdiv>\n<div style=\"position: absolute; left: 77.7%; top: -2px; font-family: 'IBM Plex Sans', sans-serif; font-size: 11px; color: #c45a3c; transform: translateY(-100%)\">₹70L<\u002Fdiv>\n<div style=\"position: absolute; right: 0; top: -2px; font-family: 'IBM Plex Sans', sans-serif; font-size: 11px; color: #c45a3c; transform: translateY(-100%)\">1,5 mill. ₹<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 11px; color: #666; margin-top: 16px; font-style: italic\">Excluye el coste del suelo. Incluye construcción, equipamiento, interiorismo, sistemas informáticos y capital circulante.<\u002Fdiv>\n<\u002Fdiv>\n<h3 id=\"capital-expenditure-setup\" style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 18px; font-weight: 600; color: #1a1a1a; margin: 40px 0 16px\">Inversión en capital (puesta en marcha)<\u002Fh3>\n<!-- INFOGRAPHIC: CAPEX Breakdown -->\n<div class=\"wm-panel\" style=\"margin: 24px 0 40px; padding: 40px; background: #f0eeea; border-radius: 4px\">\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 11px; font-weight: 600; letter-spacing: 3px; text-transform: uppercase; color: #3a5a40; margin-bottom: 24px\">Desglose típico de CAPEX: hospital de 100 camas en una ciudad de nivel 2<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 12px\">\n<div>\n<div style=\"display: flex; justify-content: space-between; margin-bottom: 6px\">\n<span style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 13px; color: #1a1a1a; font-weight: 500\">Obra civil, instalaciones e interiorismo<\u002Fspan>\n<span style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 13px; color: #555\">30-35 mill. ₹<\u002Fspan>\n<\u002Fdiv>\n<div style=\"height: 20px; background: #e0ddd8; border-radius: 3px; overflow: hidden\">\n<div style=\"width: 50%; height: 100%; background: #3a5a40; border-radius: 3px\"><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div>\n<div style=\"display: flex; justify-content: space-between; margin-bottom: 6px\">\n<span style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 13px; color: #1a1a1a; font-weight: 500\">Equipamiento médico<\u002Fspan>\n<span style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 13px; color: #555\">20-25 mill. ₹<\u002Fspan>\n<\u002Fdiv>\n<div style=\"height: 20px; background: #e0ddd8; border-radius: 3px; overflow: hidden\">\n<div style=\"width: 36%; height: 100%; background: #4a6a50; border-radius: 3px\"><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div>\n<div style=\"display: flex; justify-content: space-between; margin-bottom: 6px\">\n<span style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 13px; color: #1a1a1a; font-weight: 500\">Capital circulante y contingencias<\u002Fspan>\n<span style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 13px; color: #555\">4-5 mill. ₹<\u002Fspan>\n<\u002Fdiv>\n<div style=\"height: 20px; background: #e0ddd8; border-radius: 3px; overflow: hidden\">\n<div style=\"width: 7%; height: 100%; background: #6a8a70; border-radius: 3px\"><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div>\n<div style=\"display: flex; justify-content: space-between; margin-bottom: 6px\">\n<span style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 13px; color: #1a1a1a; font-weight: 500\">Sistemas informáticos (HIS, HCE, facturación)<\u002Fspan>\n<span style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 13px; color: #555\">2-3 mill. ₹<\u002Fspan>\n<\u002Fdiv>\n<div style=\"height: 20px; background: #e0ddd8; border-radius: 3px; overflow: hidden\">\n<div style=\"width: 4%; height: 100%; background: #8aaa90; border-radius: 3px\"><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div>\n<div style=\"display: flex; justify-content: space-between; margin-bottom: 6px\">\n<span style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 13px; color: #1a1a1a; font-weight: 500\">Cumplimiento normativo y certificaciones<\u002Fspan>\n<span style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 13px; color: #555\">1,5-2 mill. ₹<\u002Fspan>\n<\u002Fdiv>\n<div style=\"height: 20px; background: #e0ddd8; border-radius: 3px; overflow: hidden\">\n<div style=\"width: 3%; height: 100%; background: #9aba9f; border-radius: 3px\"><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; justify-content: space-between; margin-top: 20px; padding-top: 16px; border-top: 2px solid #d0cdc8\">\n<span style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; color: #1a1a1a; font-weight: 700\">CAPEX total estimado<\u002Fspan>\n<span style=\"font-family: Georgia, serif; font-size: clamp(1.05rem, 2.6vw, 1.25rem); color: #3a5a40; font-weight: 700\">60-70 millones de ₹<\u002Fspan>\n<\u002Fdiv>\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 11px; color: #999; margin-top: 8px\">Fuente: Hospitech Health, Hoscraft. Excluye la adquisición del suelo.<\u002Fdiv>\n<\u002Fdiv>\n<!-- Total project cost by size -->\n<div class=\"wm-grid\" style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(150px, 100%), 1fr)); gap: 16px; margin: 0 0 40px\">\n<div style=\"padding: 24px; background: #f0eeea; border-radius: 4px; text-align: center\">\n<div style=\"font-family: Georgia, serif; font-size: clamp(1.25rem, 3.8vw, 1.75rem); color: #3a5a40; line-height: 1\">8-15 mill. ₹<\u002Fdiv>\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 12px; color: #555; margin-top: 8px\">hospital de 20 camas<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"padding: 24px; background: #f0eeea; border-radius: 4px; text-align: center\">\n<div style=\"font-family: Georgia, serif; font-size: clamp(1.25rem, 3.8vw, 1.75rem); color: #3a5a40; line-height: 1\">20-50 mill. ₹<\u002Fdiv>\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 12px; color: #555; margin-top: 8px\">hospital de 50 camas<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"padding: 24px; background: #f0eeea; border-radius: 4px; text-align: center\">\n<div style=\"font-family: Georgia, serif; font-size: clamp(1.25rem, 3.8vw, 1.75rem); color: #3a5a40; line-height: 1\">30-60 mill. ₹<\u002Fdiv>\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 12px; color: #555; margin-top: 8px\">hospital de 100 camas<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"padding: 24px; background: #f0eeea; border-radius: 4px; text-align: center\">\n<div style=\"font-family: Georgia, serif; font-size: clamp(1.25rem, 3.8vw, 1.75rem); color: #3a5a40; line-height: 1\">60-120 mill. ₹<\u002Fdiv>\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 12px; color: #555; margin-top: 8px\">hospital de 200 camas<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<p style=\"font-family: Georgia, serif; font-size: 17px; line-height: 1.8; color: #333; margin: 0 0 24px\">La construcción es la mayor partida individual, con un 35-40 % del total del proyecto. El equipamiento médico es la siguiente, seguida del capital circulante necesario para sostener la operación durante los primeros 6-12 meses, hasta que los ingresos se estabilizan. Operadores económicos como Ujala Cygnus han demostrado que una planificación cuidadosa puede reducir el coste por cama a 10-15 lakhs de rupias —una fracción de la media metropolitana de 50-90 lakhs— evitando el sobredimensionamiento y centrándose en lo clínicamente esencial.<\u002Fp>\n<h3 id=\"operational-expenditure-running-costs\" style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 18px; font-weight: 600; color: #1a1a1a; margin: 40px 0 16px\">Gasto operativo (costes de funcionamiento)<\u002Fh3>\n<p style=\"font-family: Georgia, serif; font-size: 17px; line-height: 1.8; color: #333; margin: 0 0 24px\">Operar un hospital en la India cuesta aproximadamente entre 2 y 5 lakhs de rupias por cama y año. Los salarios del personal —médicos, enfermería, técnicos y apoyo— dominan con cerca del 70 % del presupuesto operativo. El 30 % restante cubre consumibles, medicamentos, suministros, mantenimiento y gastos administrativos.<\u002Fp>\n<!-- INFOGRAPHIC: OPEX Breakdown -->\n<div class=\"wm-panel\" style=\"margin: 32px 0; padding: 40px; background: #1a1a1a; border-radius: 4px\">\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 11px; font-weight: 600; letter-spacing: 3px; text-transform: uppercase; color: #8fbc8f; margin-bottom: 28px\">Desglose del coste operativo anual<\u002Fdiv>\n<div style=\"display: flex; height: 48px; border-radius: 4px; overflow: hidden; margin-bottom: 20px\">\n<div style=\"width: 45%; background: #3a5a40; display: flex; align-items: center; justify-content: center\">\n<span style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 12px; color: #fff; font-weight: 600\">Salarios médicos 45 %<\u002Fspan>\n<\u002Fdiv>\n<div style=\"width: 25%; background: #4a6a50; display: flex; align-items: center; justify-content: center\">\n<span style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 11px; color: #fff; font-weight: 600\">Enfermería y personal 25 %<\u002Fspan>\n<\u002Fdiv>\n<div style=\"width: 15%; background: #c45a3c; display: flex; align-items: center; justify-content: center\">\n<span style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 10px; color: #fff; font-weight: 600\">Medicamentos 15 %<\u002Fspan>\n<\u002Fdiv>\n<div style=\"width: 8%; background: #d4725a; display: flex; align-items: center; justify-content: center\">\n<span style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 9px; color: #fff; font-weight: 600\">Sumin.<\u002Fspan>\n<\u002Fdiv>\n<div style=\"width: 7%; background: #777; display: flex; align-items: center; justify-content: center\">\n<span style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 9px; color: #fff; font-weight: 600\">Otros<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; gap: 20px; flex-wrap: wrap\">\n<div style=\"display: flex; align-items: center; gap: 6px\"><div style=\"width: 10px; height: 10px; background: #3a5a40; border-radius: 2px\"><\u002Fdiv><span style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 11px; color: #888\">Salarios y honorarios médicos<\u002Fspan><\u002Fdiv>\n<div style=\"display: flex; align-items: center; gap: 6px\"><div style=\"width: 10px; height: 10px; background: #4a6a50; border-radius: 2px\"><\u002Fdiv><span style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 11px; color: #888\">Enfermería y personal de apoyo<\u002Fspan><\u002Fdiv>\n<div style=\"display: flex; align-items: center; gap: 6px\"><div style=\"width: 10px; height: 10px; background: #c45a3c; border-radius: 2px\"><\u002Fdiv><span style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 11px; color: #888\">Medicamentos y consumibles<\u002Fspan><\u002Fdiv>\n<div style=\"display: flex; align-items: center; gap: 6px\"><div style=\"width: 10px; height: 10px; background: #d4725a; border-radius: 2px\"><\u002Fdiv><span style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 11px; color: #888\">Suministros y mantenimiento<\u002Fspan><\u002Fdiv>\n<div style=\"display: flex; align-items: center; gap: 6px\"><div style=\"width: 10px; height: 10px; background: #777; border-radius: 2px\"><\u002Fdiv><span style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 11px; color: #888\">Administración y otros<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<!-- INFOGRAPHIC: CAPEX vs OPEX comparison -->\n<div class=\"wm-grid\" style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(265px, 100%), 1fr)); gap: 24px; margin: 40px 0\">\n<div style=\"background: #3a5a40; color: #fff; padding: 32px; border-radius: 4px\">\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: #8fbc8f; margin-bottom: 12px\">Coste de puesta en marcha (100 camas, nivel 2)<\u002Fdiv>\n<div style=\"font-family: Georgia, serif; font-size: clamp(1.45rem, 4.8vw, 2.25rem); line-height: 1.2\">60-70 mill. ₹<\u002Fdiv>\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 13px; color: #b0c9b0; margin-top: 8px\">Inversión de capital única<\u002Fdiv>\n<div style=\"margin-top: 16px; padding-top: 16px; border-top: 1px solid #4a6a50\">\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 12px; color: #b0c9b0\">Por cama: 60-70 lakhs de ₹<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"background: #3a5a40; color: #fff; padding: 32px; border-radius: 4px\">\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: #8fbc8f; margin-bottom: 12px\">OPEX anual (100 camas)<\u002Fdiv>\n<div style=\"font-family: Georgia, serif; font-size: clamp(1.45rem, 4.8vw, 2.25rem); line-height: 1.2\">2-5 mill. ₹<\u002Fdiv>\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 13px; color: #b0c9b0; margin-top: 8px\">Gasto anual recurrente<\u002Fdiv>\n<div style=\"margin-top: 16px; padding-top: 16px; border-top: 1px solid #4a6a50\">\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 12px; color: #b0c9b0\">Por cama: 2-5 lakhs de ₹ al año<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"border-left: 3px solid #3a5a40; padding: 24px 0 24px 32px; margin: 40px 0\">\n<div style=\"font-family: Georgia, serif; font-size: clamp(1.25rem, 3.8vw, 1.75rem); line-height: 1.4; color: #1a1a1a\">Un hospital de 100 camas bien optimizado puede alcanzar el retorno de la inversión en 6-8 años, según la combinación de servicios y la ubicación.<\u002Fdiv>\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 12px; color: #999; margin-top: 12px; letter-spacing: 1px; text-transform: uppercase\">Hospi.info, 2025<\u002Fdiv>\n<\u002Fdiv>\n<p style=\"font-family: Georgia, serif; font-size: 17px; line-height: 1.8; color: #333; margin: 0 0 24px\">La diferencia entre el posicionamiento económico y el premium es enorme. Cadenas económicas como Ujala Cygnus construyen hospitales completos por 10-15 lakhs de rupias por cama optimizando el diseño, evitando el sobreequipamiento y empleando construcción modular estandarizada. En el otro extremo, los hospitales superespecializados premium de las grandes ciudades pueden gastar entre 1 y 1,5 crores por cama en quirófanos avanzados, equipos de imagen y servicios de lujo para el paciente.<\u002Fp>\n<p style=\"font-family: Georgia, serif; font-size: 17px; line-height: 1.8; color: #333; margin: 0 0 24px\">Para la sostenibilidad operativa, la tasa de ocupación es la palanca más importante. Con una ocupación del 60-65 %, habitual en un hospital en fase de maduración, los costes fijos se reparten de forma poco eficiente. Cada punto porcentual por encima del 65 % va casi directamente al resultado. Esto explica por qué ampliar centros existentes ofrece retornos más rápidos que construir de cero: la infraestructura de coste fijo ya existe.<\u002Fp>\n<\u002Fsection>\n<!-- SECTION 08: PATIENT JOURNEY -->\n<section aria-labelledby=\"patient-journey-heading\" id=\"patient-journey\" style=\"padding: 64px 0 0; border-top: 1px solid #e0ddd8\">\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 11px; font-weight: 600; letter-spacing: 3px; text-transform: uppercase; color: #3a5a40; margin-bottom: 16px\">07<\u002Fdiv>\n<h2 id=\"patient-journey-heading\" style=\"font-family: Georgia, serif; font-size: clamp(1.45rem, 4.8vw, 2.25rem); font-weight: 400; color: #1a1a1a; margin: 0 0 32px; line-height: 1.2\">Recorrido del paciente y comportamiento del consumidor<\u002Fh2>\n<!-- INFOGRAPHIC: Patient Journey Flow -->\n<div aria-label=\"Patient Journey Through an Indian Hospital\" class=\"wm-panel\" role=\"region\" style=\"margin: 0 0 40px; padding: 40px; background: #1a1a1a; border-radius: 4px; overflow-x: auto\" tabindex=\"0\">\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 11px; font-weight: 600; letter-spacing: 3px; text-transform: uppercase; color: #8fbc8f; margin-bottom: 28px\">El recorrido del paciente en un hospital indio<\u002Fdiv>\n<div style=\"display: flex; align-items: stretch; gap: 3px; min-width: 700px\">\n<div style=\"flex: 1; background: #3a5a40; padding: 16px 10px; border-radius: 4px 0 0 4px; text-align: center; display: flex; flex-direction: column; justify-content: center; gap: 4px\">\n<div style=\"font-family: Georgia, serif; font-size: 16px; color: #8fbc8f; font-weight: 700\">1<\u002Fdiv>\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 10px; font-weight: 600; color: #fff; text-transform: uppercase; letter-spacing: 0.5px\">Conocimiento<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex: 1; background: #3f6045; padding: 16px 10px; text-align: center; display: flex; flex-direction: column; justify-content: center; gap: 4px\">\n<div style=\"font-family: Georgia, serif; font-size: 16px; color: #8fbc8f; font-weight: 700\">2<\u002Fdiv>\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 10px; font-weight: 600; color: #fff; text-transform: uppercase; letter-spacing: 0.5px\">Descubrimiento<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex: 1; background: #44664a; padding: 16px 10px; text-align: center; display: flex; flex-direction: column; justify-content: center; gap: 4px\">\n<div style=\"font-family: Georgia, serif; font-size: 16px; color: #8fbc8f; font-weight: 700\">3<\u002Fdiv>\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 10px; font-weight: 600; color: #fff; text-transform: uppercase; letter-spacing: 0.5px\">Reserva<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex: 1; background: #496c4f; padding: 16px 10px; text-align: center; display: flex; flex-direction: column; justify-content: center; gap: 4px\">\n<div style=\"font-family: Georgia, serif; font-size: 16px; color: #8fbc8f; font-weight: 700\">4<\u002Fdiv>\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 10px; font-weight: 600; color: #fff; text-transform: uppercase; letter-spacing: 0.5px\">Consulta externa<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex: 1; background: #4e7254; padding: 16px 10px; text-align: center; display: flex; flex-direction: column; justify-content: center; gap: 4px\">\n<div style=\"font-family: Georgia, serif; font-size: 16px; color: #8fbc8f; font-weight: 700\">5<\u002Fdiv>\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 10px; font-weight: 600; color: #fff; text-transform: uppercase; letter-spacing: 0.5px\">Diagnóstico<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex: 1; background: #537859; padding: 16px 10px; text-align: center; display: flex; flex-direction: column; justify-content: center; gap: 4px\">\n<div style=\"font-family: Georgia, serif; font-size: 16px; color: #8fbc8f; font-weight: 700\">6<\u002Fdiv>\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 10px; font-weight: 600; color: #fff; text-transform: uppercase; letter-spacing: 0.5px\">Tratamiento<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex: 1; background: #587e5e; padding: 16px 10px; text-align: center; display: flex; flex-direction: column; justify-content: center; gap: 4px\">\n<div style=\"font-family: Georgia, serif; font-size: 16px; color: #8fbc8f; font-weight: 700\">7<\u002Fdiv>\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 10px; font-weight: 600; color: #fff; text-transform: uppercase; letter-spacing: 0.5px\">Ingreso<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex: 1; background: #5d8463; padding: 16px 10px; text-align: center; display: flex; flex-direction: column; justify-content: center; gap: 4px\">\n<div style=\"font-family: Georgia, serif; font-size: 16px; color: #8fbc8f; font-weight: 700\">8<\u002Fdiv>\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 10px; font-weight: 600; color: #fff; text-transform: uppercase; letter-spacing: 0.5px\">Alta<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex: 1; background: #628a68; padding: 16px 10px; border-radius: 0 4px 4px 0; text-align: center; display: flex; flex-direction: column; justify-content: center; gap: 4px\">\n<div style=\"font-family: Georgia, serif; font-size: 16px; color: #8fbc8f; font-weight: 700\">9<\u002Fdiv>\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 10px; font-weight: 600; color: #fff; text-transform: uppercase; letter-spacing: 0.5px\">Seguimiento<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; gap: 3px; margin-top: 8px; min-width: 700px\">\n<div style=\"flex: 3; padding: 8px 12px; background: #2a2a2a; border-radius: 3px; text-align: center\">\n<span style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 10px; color: #8fbc8f; text-transform: uppercase; letter-spacing: 1px\">Captación<\u002Fspan>\n<\u002Fdiv>\n<div style=\"flex: 3; padding: 8px 12px; background: #2a2a2a; border-radius: 3px; text-align: center\">\n<span style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 10px; color: #c45a3c; text-transform: uppercase; letter-spacing: 1px\">Prestación asistencial<\u002Fspan>\n<\u002Fdiv>\n<div style=\"flex: 3; padding: 8px 12px; background: #2a2a2a; border-radius: 3px; text-align: center\">\n<span style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 10px; color: #d4a574; text-transform: uppercase; letter-spacing: 1px\">Fidelización<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<p style=\"font-family: Georgia, serif; font-size: 17px; line-height: 1.8; color: #333; margin: 0 0 24px\">El recorrido del paciente en los hospitales indios abarca: conocimiento → descubrimiento → cita → visita → diagnóstico → tratamiento → ingreso → procedimiento → alta → seguimiento. En cada etapa, los abandonos suponen ingresos perdidos. Los hospitales pierden ingresos significativos por ausencias, cancelaciones, abandono del tratamiento y pacientes que eligen a la competencia.<\u002Fp>\n<p style=\"font-family: Georgia, serif; font-size: 17px; line-height: 1.8; color: #333; margin: 0 0 24px\">Los canales de captación de pacientes incluyen derivaciones médicas, búsqueda orgánica (Google), publicidad digital de pago, visitas espontáneas, redes de aseguradoras y programas de salud corporativos. El turismo médico aporta entre el 10 % y el 15 % de los ingresos de los principales operadores. El coste de captación por paciente varía notablemente según la especialidad y el canal.<\u002Fp>\n<p style=\"font-family: Georgia, serif; font-size: 17px; line-height: 1.8; color: #333; margin: 0 0 24px\">Cómo eligen hospital los pacientes: la reputación del médico, la marca, el precio, la ubicación, las reseñas, la red aseguradora y el tiempo de espera influyen en la decisión. En las ciudades de primer nivel dominan la marca y la disponibilidad de especialistas; en las de segundo y tercer nivel pesan más la proximidad y la sensibilidad al precio. La interacción digital es cada vez más determinante: la comunicación por WhatsApp, la cita en línea y el seguimiento por telemedicina son ya expectativas básicas.<\u002Fp>\n<\u002Fsection>\n<!-- SECTION 08: INSURANCE -->\n<section aria-labelledby=\"insurance-payers-heading\" id=\"insurance-payers\" style=\"padding: 64px 0 0; border-top: 1px solid #e0ddd8\">\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 11px; font-weight: 600; letter-spacing: 3px; text-transform: uppercase; color: #3a5a40; margin-bottom: 16px\">08<\u002Fdiv>\n<h2 id=\"insurance-payers-heading\" style=\"font-family: Georgia, serif; font-size: clamp(1.45rem, 4.8vw, 2.25rem); font-weight: 400; color: #1a1a1a; margin: 0 0 32px; line-height: 1.2\">Seguros y ecosistema de pagadores<\u002Fh2>\n<div style=\"border-left: 3px solid #3a5a40; padding: 24px 0 24px 32px; margin: 0 0 40px\">\n<div style=\"font-family: Georgia, serif; font-size: clamp(1.25rem, 3.8vw, 1.75rem); line-height: 1.4; color: #1a1a1a\">Ayushman Bharat ha ahorrado a las familias más de 1,52 billones de rupias en gastos de bolsillo desde su lanzamiento.<\u002Fdiv>\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 12px; color: #999; margin-top: 12px; letter-spacing: 1px; text-transform: uppercase\">Encuesta Económica de la India 2024-25<\u002Fdiv>\n<\u002Fdiv>\n<p style=\"font-family: Georgia, serif; font-size: 17px; line-height: 1.8; color: #333; margin: 0 0 24px\">Ayushman Bharat – Pradhan Mantri Jan Arogya Yojana (AB-PMJAY) es el mayor programa de seguro sanitario con financiación pública del mundo. Ofrece una cobertura de hasta 5 lakhs de rupias por familia y año para hospitalización secundaria y terciaria, dirigida a unos 550 millones de beneficiarios en 123,7 millones de familias: el 40 % más desfavorecido de la población india.<\u002Fp>\n<div class=\"wm-grid\" style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(185px, 100%), 1fr)); gap: 24px; margin: 32px 0\">\n<div style=\"padding: 24px; background: #f0eeea; border-radius: 4px\">\n<div style=\"font-family: Georgia, serif; font-size: clamp(1.35rem, 4.2vw, 2rem); color: #3a5a40\">más de 420 mill.<\u002Fdiv>\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 13px; color: #555; margin-top: 6px\">Tarjetas Ayushman emitidas (oct. 2025)<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"padding: 24px; background: #f0eeea; border-radius: 4px\">\n<div style=\"font-family: Georgia, serif; font-size: clamp(1.35rem, 4.2vw, 2rem); color: #3a5a40\">33,000<\u002Fdiv>\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 13px; color: #555; margin-top: 6px\">Hospitales adheridos<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"padding: 24px; background: #f0eeea; border-radius: 4px\">\n<div style=\"font-family: Georgia, serif; font-size: clamp(1.35rem, 4.2vw, 2rem); color: #3a5a40\">116,9 mill.<\u002Fdiv>\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 13px; color: #555; margin-top: 6px\">Ingresos hospitalarios autorizados<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<p style=\"font-family: Georgia, serif; font-size: 17px; line-height: 1.8; color: #333; margin: 0 0 24px\">En febrero de 2026, AB-PMJAY había autorizado 116,9 millones de ingresos hospitalarios, de los cuales 67,4 millones en hospitales privados. El programa cubre 33.000 hospitales adheridos (17.685 públicos y 15.380 privados). En octubre de 2024, la cobertura se amplió a todas las personas mayores de 70 años con independencia de su situación socioeconómica.<\u002Fp>\n<!-- INFOGRAPHIC: Insurance Coverage Breakdown -->\n<div class=\"wm-panel\" style=\"margin: 0 0 40px; padding: 40px; background: #f0eeea; border-radius: 4px\">\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 11px; font-weight: 600; letter-spacing: 3px; text-transform: uppercase; color: #3a5a40; margin-bottom: 28px\">Los 1.400 millones de la India: desglose de la cobertura sanitaria<\u002Fdiv>\n<div style=\"display: flex; height: 56px; border-radius: 4px; overflow: hidden\">\n<div style=\"width: 39.3%; background: #3a5a40; display: flex; align-items: center; justify-content: center; padding: 0 8px\">\n<span style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 12px; color: #fff; font-weight: 600; text-align: center\">Ayushman Bharat<br/>~550M<\u002Fspan>\n<\u002Fdiv>\n<div style=\"width: 17.9%; background: #5a7a60; display: flex; align-items: center; justify-content: center; padding: 0 8px\">\n<span style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 11px; color: #fff; font-weight: 600; text-align: center\">Programas estatales<br/>~250M<\u002Fspan>\n<\u002Fdiv>\n<div style=\"width: 14.3%; background: #7a9a80; display: flex; align-items: center; justify-content: center; padding: 0 8px\">\n<span style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 11px; color: #1a1a1a; font-weight: 600; text-align: center\">Seguro privado<br/>~200M<\u002Fspan>\n<\u002Fdiv>\n<div style=\"width: 28.5%; background: #c45a3c; display: flex; align-items: center; justify-content: center; padding: 0 8px\">\n<span style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 12px; color: #fff; font-weight: 600; text-align: center\">Sin seguro ~400 mill.<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 11px; color: #999; margin-top: 12px\">Nota: existe un solapamiento significativo entre los programas nacionales y estatales. La cobertura neta única se estima en torno al 60 % de la población.<\u002Fdiv>\n<\u002Fdiv>\n<p style=\"font-family: Georgia, serif; font-size: 17px; line-height: 1.8; color: #333; margin: 0 0 24px\">Pese a los avances, unos 400 millones de indios siguen sin seguro. Los hogares aún asumen cerca del 47 % del coste médico total (frente al 64 % en 2014). El seguro privado crece, pero sigue concentrado en la población urbana y asalariada. La combinación de pagadores —programa público, privado y gasto de bolsillo— determina de raíz la economía hospitalaria y los segmentos a los que los hospitales se dirigen.<\u002Fp>\n<\u002Fsection>\n<!-- SECTION 09: WORKFORCE -->\n<section aria-labelledby=\"workforce-staffing-heading\" id=\"workforce-staffing\" style=\"padding: 64px 0 0; border-top: 1px solid #e0ddd8\">\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 11px; font-weight: 600; letter-spacing: 3px; text-transform: uppercase; color: #3a5a40; margin-bottom: 16px\">09<\u002Fdiv>\n<h2 id=\"workforce-staffing-heading\" style=\"font-family: Georgia, serif; font-size: clamp(1.45rem, 4.8vw, 2.25rem); font-weight: 400; color: #1a1a1a; margin: 0 0 32px; line-height: 1.2\">Personal y plantilla<\u002Fh2>\n<p style=\"font-family: Georgia, serif; font-size: 17px; line-height: 1.8; color: #333; margin: 0 0 24px\">La sanidad es, en esencia, un sector impulsado por los médicos. Se espera que la demanda de profesionales sanitarios indios se duplique tanto en el país como en el extranjero para 2030. En muchos estados, las zonas rurales sufren una ratio de un médico por cada 2.000 habitantes, muy lejos del 1:1.000 recomendado por la OMS.<\u002Fp>\n<!-- INFOGRAPHIC: Medical Education Growth -->\n<div class=\"wm-panel\" style=\"margin: 0 0 32px; padding: 40px; background: #f0eeea; border-radius: 4px\">\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 11px; font-weight: 600; letter-spacing: 3px; text-transform: uppercase; color: #3a5a40; margin-bottom: 28px\">Capacidad de formación médica: 2014 frente a 2024<\u002Fdiv>\n<div class=\"wm-grid\" style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(265px, 100%), 1fr)); gap: 32px\">\n<div>\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 12px; color: #777; margin-bottom: 12px; font-weight: 500\">Facultades de medicina<\u002Fdiv>\n<div style=\"display: flex; align-items: flex-end; gap: 12px; height: 120px; margin-bottom: 8px\">\n<div style=\"flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%\">\n<div style=\"font-family: Georgia, serif; font-size: 18px; color: #1a1a1a; margin-bottom: 6px\">387<\u002Fdiv>\n<div style=\"width: 100%; background: #b0c4b0; border-radius: 3px 3px 0 0; height: 55%\"><\u002Fdiv>\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 11px; color: #999; margin-top: 6px\">2014<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%\">\n<div style=\"font-family: Georgia, serif; font-size: 18px; color: #3a5a40; font-weight: 600; margin-bottom: 6px\">706<\u002Fdiv>\n<div style=\"width: 100%; background: #3a5a40; border-radius: 3px 3px 0 0; height: 100%\"><\u002Fdiv>\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 11px; color: #999; margin-top: 6px\">2024<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 12px; color: #3a5a40; font-weight: 600; text-align: center\">+82 % de crecimiento<\u002Fdiv>\n<\u002Fdiv>\n<div>\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 12px; color: #777; margin-bottom: 12px; font-weight: 500\">Plazas de medicina por año<\u002Fdiv>\n<div style=\"display: flex; align-items: flex-end; gap: 12px; height: 120px; margin-bottom: 8px\">\n<div style=\"flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%\">\n<div style=\"font-family: Georgia, serif; font-size: 18px; color: #1a1a1a; margin-bottom: 6px\">51K<\u002Fdiv>\n<div style=\"width: 100%; background: #b0c4b0; border-radius: 3px 3px 0 0; height: 47%\"><\u002Fdiv>\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 11px; color: #999; margin-top: 6px\">2014<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%\">\n<div style=\"font-family: Georgia, serif; font-size: 18px; color: #3a5a40; font-weight: 600; margin-bottom: 6px\">109K<\u002Fdiv>\n<div style=\"width: 100%; background: #3a5a40; border-radius: 3px 3px 0 0; height: 100%\"><\u002Fdiv>\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 11px; color: #999; margin-top: 6px\">2024<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 12px; color: #3a5a40; font-weight: 600; text-align: center\">+113 % de crecimiento<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<p style=\"font-family: Georgia, serif; font-size: 17px; line-height: 1.8; color: #333; margin: 0 0 24px\">Dinámicas laborales clave que configuran el sector:<\u002Fp>\n<div style=\"display: flex; flex-direction: column; gap: 16px; margin: 24px 0\">\n<div style=\"display: flex; gap: 16px; padding: 20px; background: #f0eeea; border-radius: 4px\">\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-weight: 700; color: #3a5a40; min-width: 28px\">01<\u002Fdiv>\n<div>\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-weight: 600; font-size: 15px; color: #1a1a1a; margin-bottom: 4px\">Expansión de la formación médica<\u002Fdiv>\n<div style=\"font-family: Georgia, serif; font-size: 15px; color: #555; line-height: 1.6\">706 facultades de medicina con 109.145 plazas (frente a 387 facultades en 2014). Escuelas de enfermería: 8.692 (frente a 5.700).<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; gap: 16px; padding: 20px; background: #f0eeea; border-radius: 4px\">\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-weight: 700; color: #3a5a40; min-width: 28px\">02<\u002Fdiv>\n<div>\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-weight: 600; font-size: 15px; color: #1a1a1a; margin-bottom: 4px\">Poder de negociación de los médicos<\u002Fdiv>\n<div style=\"font-family: Georgia, serif; font-size: 15px; color: #555; line-height: 1.6\">Los grandes especialistas tienen un poder de negociación considerable. La demanda de los pacientes se concentra en torno a médicos concretos, sobre todo en especialidades quirúrgicas.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; gap: 16px; padding: 20px; background: #f0eeea; border-radius: 4px\">\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-weight: 700; color: #3a5a40; min-width: 28px\">03<\u002Fdiv>\n<div>\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-weight: 600; font-size: 15px; color: #1a1a1a; margin-bottom: 4px\">Disparidad entre lo urbano y lo rural<\u002Fdiv>\n<div style=\"font-family: Georgia, serif; font-size: 15px; color: #555; line-height: 1.6\">Los profesionales sanitarios se concentran en los núcleos urbanos, dejando la India rural crónicamente desatendida.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n<!-- SECTION 10: TECHNOLOGY & AI -->\n<section aria-labelledby=\"technology-ai-heading\" id=\"technology-ai\" style=\"padding: 64px 0 0; border-top: 1px solid #e0ddd8\">\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 11px; font-weight: 600; letter-spacing: 3px; text-transform: uppercase; color: #3a5a40; margin-bottom: 16px\">10<\u002Fdiv>\n<h2 id=\"technology-ai-heading\" style=\"font-family: Georgia, serif; font-size: clamp(1.45rem, 4.8vw, 2.25rem); font-weight: 400; color: #1a1a1a; margin: 0 0 32px; line-height: 1.2\">Tecnología e IA<\u002Fh2>\n<p style=\"font-family: Georgia, serif; font-size: 17px; line-height: 1.8; color: #333; margin: 0 0 24px\">En 2023, el 34 % de las organizaciones sanitarias de la India estaban probando proyectos de IA y el 16 % había llevado iniciativas de IA generativa a producción. El segmento de salud digital crece a un 24,4 % anual compuesto (2025-30), mientras que la analítica sanitaria se proyecta al 25,01 % en el mismo periodo.<\u002Fp>\n<p style=\"font-family: Georgia, serif; font-size: 17px; line-height: 1.8; color: #333; margin: 0 0 24px\">La pila tecnológica hospitalaria suele incluir sistemas de información hospitalaria (HIS), historia clínica electrónica, sistemas de facturación, LIS/PACS para diagnóstico, plataformas de interacción con el paciente y, cada vez más, herramientas de IA para diagnóstico, eficiencia operativa y comunicación con el paciente.<\u002Fp>\n<div class=\"wm-panel\" style=\"background: #1a1a1a; color: #fff; padding: 40px; border-radius: 4px; margin: 32px 0\">\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 11px; font-weight: 600; letter-spacing: 3px; text-transform: uppercase; color: #8fbc8f; margin-bottom: 24px\">Principales iniciativas digitales<\u002Fdiv>\n<div class=\"wm-grid\" style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(265px, 100%), 1fr)); gap: 24px\">\n<div>\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 15px; font-weight: 600; color: #fff; margin-bottom: 8px\">Misión Digital Ayushman Bharat<\u002Fdiv>\n<div style=\"font-family: Georgia, serif; font-size: 14px; color: #aaa; line-height: 1.6\">Ecosistema digital de salud unificado con historia clínica electrónica, integración de telemedicina e identificadores sanitarios para toda la ciudadanía.<\u002Fdiv>\n<\u002Fdiv>\n<div>\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 15px; font-weight: 600; color: #fff; margin-bottom: 8px\">Certificación digital NABH<\u002Fdiv>\n<div style=\"font-family: Georgia, serif; font-size: 14px; color: #aaa; line-height: 1.6\">100 centros certificados a septiembre de 2024. Más de 4.650 hospitales acreditados por la NABH a mayo de 2025, con una previsión de más de 2.000 adicionales para 2028.<\u002Fdiv>\n<\u002Fdiv>\n<div>\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 15px; font-weight: 600; color: #fff; margin-bottom: 8px\">Crecimiento de la farmacia en línea<\u002Fdiv>\n<div style=\"font-family: Georgia, serif; font-size: 14px; color: #aaa; line-height: 1.6\">El mercado se multiplicó casi por cuatro, de 512 millones de dólares (2018) a 2.000 millones (2024), estabilizándose en torno a un 20 % de crecimiento anual.<\u002Fdiv>\n<\u002Fdiv>\n<div>\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 15px; font-weight: 600; color: #fff; margin-bottom: 8px\">Cirugía robótica y tratamientos avanzados<\u002Fdiv>\n<div style=\"font-family: Georgia, serif; font-size: 14px; color: #aaa; line-height: 1.6\">Apollo invierte 80 millones de rupias en tratamiento oncológico con IA en Bangalore. La terapia de protones, el CAR-T y los sistemas da Vinci se están expandiendo.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n<!-- SECTION 11: MEDICAL TOURISM -->\n<section aria-labelledby=\"medical-tourism-heading\" id=\"medical-tourism\" style=\"padding: 64px 0 0; border-top: 1px solid #e0ddd8\">\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 11px; font-weight: 600; letter-spacing: 3px; text-transform: uppercase; color: #3a5a40; margin-bottom: 16px\">11<\u002Fdiv>\n<h2 id=\"medical-tourism-heading\" style=\"font-family: Georgia, serif; font-size: clamp(1.45rem, 4.8vw, 2.25rem); font-weight: 400; color: #1a1a1a; margin: 0 0 32px; line-height: 1.2\">Turismo médico<\u002Fh2>\n<p style=\"font-family: Georgia, serif; font-size: 17px; line-height: 1.8; color: #333; margin: 0 0 24px\">La India es un destino global de primer orden en turismo médico. Las llegadas de pacientes extranjeros para tratamiento pasaron de 182.945 en 2020 a 644.387 en 2024, un rebote decisivo tras la pandemia. El mercado se valoró en unos 7.690 millones de dólares en 2024, con aproximadamente 7,3 millones de pacientes extranjeros desplazados a la India para recibir tratamiento médico.<\u002Fp>\n<div class=\"wm-grid\" style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(265px, 100%), 1fr)); gap: 24px; margin: 32px 0\">\n<div style=\"padding: 32px; background: #f0eeea; border-radius: 4px\">\n<div style=\"font-family: Georgia, serif; font-size: clamp(1.45rem, 4.8vw, 2.25rem); color: #3a5a40; line-height: 1\">$7.7B<\u002Fdiv>\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 13px; color: #555; margin-top: 8px; line-height: 1.4\">Mercado del turismo médico (2024)<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"padding: 32px; background: #f0eeea; border-radius: 4px\">\n<div style=\"font-family: Georgia, serif; font-size: clamp(1.45rem, 4.8vw, 2.25rem); color: #3a5a40; line-height: 1\">13%+<\u002Fdiv>\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 13px; color: #555; margin-top: 8px; line-height: 1.4\">TCAC prevista hasta 2034<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<!-- INFOGRAPHIC: Medical Tourism Cost Comparison -->\n<div class=\"wm-panel\" style=\"margin: 0 0 40px; padding: 40px; background: #1a1a1a; border-radius: 4px\">\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 11px; font-weight: 600; letter-spacing: 3px; text-transform: uppercase; color: #8fbc8f; margin-bottom: 28px\">Coste de una cirugía de baipás coronario por país<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 12px\">\n<div style=\"display: flex; align-items: center; gap: 16px\">\n<div class=\"wm-chart-label\" style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 13px; color: #999; width: 80px; text-align: right; flex-shrink: 0\">EE. UU.<\u002Fdiv>\n<div style=\"flex: 1; height: 28px; background: #2a2a2a; border-radius: 3px; overflow: hidden\">\n<div style=\"width: 100%; height: 100%; background: #555; border-radius: 3px; display: flex; align-items: center; padding-left: 12px; box-sizing: border-box\">\n<span style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 12px; color: #fff; font-weight: 600\">$123,000<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; align-items: center; gap: 16px\">\n<div class=\"wm-chart-label\" style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 13px; color: #999; width: 80px; text-align: right; flex-shrink: 0\">Reino Unido<\u002Fdiv>\n<div style=\"flex: 1; height: 28px; background: #2a2a2a; border-radius: 3px; overflow: hidden\">\n<div style=\"width: 52%; height: 100%; background: #555; border-radius: 3px; display: flex; align-items: center; padding-left: 12px\">\n<span style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 12px; color: #fff; font-weight: 600\">$64,000<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; align-items: center; gap: 16px\">\n<div class=\"wm-chart-label\" style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 13px; color: #999; width: 80px; text-align: right; flex-shrink: 0\">Singapur<\u002Fdiv>\n<div style=\"flex: 1; height: 28px; background: #2a2a2a; border-radius: 3px; overflow: hidden\">\n<div style=\"width: 28.5%; height: 100%; background: #555; border-radius: 3px; display: flex; align-items: center; padding-left: 12px\">\n<span style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 12px; color: #fff; font-weight: 600\">$35,000<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; align-items: center; gap: 16px\">\n<div class=\"wm-chart-label\" style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 13px; color: #999; width: 80px; text-align: right; flex-shrink: 0\">Tailandia<\u002Fdiv>\n<div style=\"flex: 1; height: 28px; background: #2a2a2a; border-radius: 3px; overflow: hidden\">\n<div style=\"width: 11.4%; height: 100%; background: #6a8a70; border-radius: 3px; display: flex; align-items: center; padding-left: 12px\">\n<span style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 12px; color: #fff; font-weight: 600\">$14,000<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; align-items: center; gap: 16px\">\n<div class=\"wm-chart-label\" style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 13px; color: #fff; width: 80px; text-align: right; flex-shrink: 0; font-weight: 600\">India<\u002Fdiv>\n<div style=\"flex: 1; height: 32px; background: #2a2a2a; border-radius: 3px; overflow: hidden\">\n<div style=\"width: 5.7%; height: 100%; background: #3a5a40; border-radius: 3px; display: flex; align-items: center; padding-left: 12px; min-width: 80px\">\n<span style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 13px; color: #fff; font-weight: 700\">$7,000<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 11px; color: #666; margin-top: 16px; font-style: italic\">Costes indicativos para una intervención de baipás. Los costes reales varían según el hospital, la complejidad y el seguro.<\u002Fdiv>\n<\u002Fdiv>\n<p style=\"font-family: Georgia, serif; font-size: 17px; line-height: 1.8; color: #333; margin: 0 0 24px\">La ventaja competitiva de la India descansa en unos costes de tratamiento del 10-20 % de los occidentales, una amplia base de profesionales cualificados, centros acreditados por la JCI y la NABH y una tramitación rápida del visado médico electrónico que cubre 167 países. Entre los tratamientos más demandados destacan la cirugía cardiovascular (22,5 % de los ingresos por turismo médico), la oncología, la traumatología, la odontología y la fertilidad o FIV.<\u002Fp>\n<p style=\"font-family: Georgia, serif; font-size: 17px; line-height: 1.8; color: #333; margin: 0 0 24px\">Los países de origen incluyen naciones vecinas, Oriente Medio (Omán, Maldivas), África y los países de la CEI. Los acuerdos con aseguradoras de Maldivas, Omán y Mauricio reducen aún más el riesgo del gasto de bolsillo. Se prevé que el sur de la India registre el mayor crecimiento regional del turismo médico, con un 12,8 % anual compuesto hasta 2036.<\u002Fp>\n<\u002Fsection>\n<!-- SECTION 12: INVESTMENTS & FDI -->\n<section aria-labelledby=\"investments-fdi-heading\" id=\"investments-fdi\" style=\"padding: 64px 0 0; border-top: 1px solid #e0ddd8\">\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 11px; font-weight: 600; letter-spacing: 3px; text-transform: uppercase; color: #3a5a40; margin-bottom: 16px\">12<\u002Fdiv>\n<h2 id=\"investments-fdi-heading\" style=\"font-family: Georgia, serif; font-size: clamp(1.45rem, 4.8vw, 2.25rem); font-weight: 400; color: #1a1a1a; margin: 0 0 32px; line-height: 1.2\">Inversiones y capital extranjero<\u002Fh2>\n<p style=\"font-family: Georgia, serif; font-size: 17px; line-height: 1.8; color: #333; margin: 0 0 24px\">Los fondos globales de capital riesgo y soberanos han invertido 15.500 millones de dólares en el sector sanitario indio en los últimos cinco años, transformando la propiedad hospitalaria de modelos de médico promotor a entidades controladas por fondos. Solo los hospitales atrajeron el 68 % de ese capital: 4.960 millones de dólares entre 2022 y 2024. Hoy, casi la mitad de las principales cadenas hospitalarias del país están en manos de capital riesgo internacional.<\u002Fp>\n<div class=\"wm-grid\" style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(185px, 100%), 1fr)); gap: 24px; margin: 32px 0\">\n<div style=\"padding: 24px; background: #3a5a40; border-radius: 4px; text-align: center\">\n<div style=\"font-family: Georgia, serif; font-size: clamp(1.45rem, 4.8vw, 2.25rem); color: #fff; line-height: 1\">$15.5B<\u002Fdiv>\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 12px; color: #b0c9b0; margin-top: 8px\">Inversión de capital riesgo en sanidad<br/>(2019–2024)<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"padding: 24px; background: #3a5a40; border-radius: 4px; text-align: center\">\n<div style=\"font-family: Georgia, serif; font-size: clamp(1.45rem, 4.8vw, 2.25rem); color: #fff; line-height: 1\">$5.5B<\u002Fdiv>\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 12px; color: #b0c9b0; margin-top: 8px\">Año récord (2023)<br/>+25 % interanual<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"padding: 24px; background: #3a5a40; border-radius: 4px; text-align: center\">\n<div style=\"font-family: Georgia, serif; font-size: clamp(1.45rem, 4.8vw, 2.25rem); color: #fff; line-height: 1\">68%<\u002Fdiv>\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 12px; color: #b0c9b0; margin-top: 8px\">Del capital de fondos dirigido<br/>a hospitales<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<!-- INFOGRAPHIC: Ownership Map -->\n<h3 id=\"who-owns-indias-hospitals\" style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 18px; font-weight: 600; color: #1a1a1a; margin: 48px 0 16px\">Quién posee los hospitales de la India<\u002Fh3>\n<p style=\"font-family: Georgia, serif; font-size: 17px; line-height: 1.8; color: #333; margin: 0 0 24px\">Desde 2021, al menos nueve grandes operaciones en las que participaron Temasek, Blackstone, KKR, General Atlantic, Ontario Teachers' Pension Plan y Barings han reconfigurado la propiedad de destacadas cadenas hospitalarias. Estos flujos de capital suelen implicar transacciones entre fondos, con activos que pasan de uno a otro a valoraciones crecientes.<\u002Fp>\n<div class=\"wm-panel\" style=\"margin: 32px 0; padding: 40px; background: #1a1a1a; border-radius: 4px\">\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 11px; font-weight: 600; letter-spacing: 3px; text-transform: uppercase; color: #8fbc8f; margin-bottom: 28px\">Mapa de propiedad de los hospitales multiespecialidad<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 16px\">\n<div style=\"display: flex; align-items: center; gap: 16px; padding: 16px; background: #2a2a2a; border-radius: 4px; border-left: 4px solid #c45a3c\">\n<div style=\"min-width: 130px\">\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; color: #fff; font-weight: 600\">Temasek<\u002Fdiv>\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 11px; color: #888\">Singapur · Fondo soberano<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex: 1; display: flex; flex-wrap: wrap; gap: 8px\">\n<div style=\"padding: 6px 12px; background: #333; border-radius: 3px; font-family: 'IBM Plex Sans', sans-serif; font-size: 12px; color: #fff\">Manipal Hospitals <span style=\"color: #8fbc8f\">~59%<\u002Fspan><\u002Fdiv>\n<div style=\"padding: 6px 12px; background: #333; border-radius: 3px; font-family: 'IBM Plex Sans', sans-serif; font-size: 12px; color: #ccc\">Cloudnine <span style=\"color: #888\">minoritaria<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; align-items: center; gap: 16px; padding: 16px; background: #2a2a2a; border-radius: 4px; border-left: 4px solid #d4a574\">\n<div style=\"min-width: 130px\">\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; color: #fff; font-weight: 600\">Blackstone<\u002Fdiv>\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 11px; color: #888\">EE. UU. · Capital riesgo<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex: 1; display: flex; flex-wrap: wrap; gap: 8px\">\n<div style=\"padding: 6px 12px; background: #333; border-radius: 3px; font-family: 'IBM Plex Sans', sans-serif; font-size: 12px; color: #fff\">KIMS Kerala <span style=\"color: #8fbc8f\">~80%<\u002Fspan><\u002Fdiv>\n<div style=\"padding: 6px 12px; background: #333; border-radius: 3px; font-family: 'IBM Plex Sans', sans-serif; font-size: 12px; color: #fff\">Care Hospitals <span style=\"color: #8fbc8f\">~73%<\u002Fspan><\u002Fdiv>\n<div style=\"padding: 6px 12px; background: #333; border-radius: 3px; font-family: 'IBM Plex Sans', sans-serif; font-size: 12px; color: #ccc\">fusión Quality Care → Aster DM<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; align-items: center; gap: 16px; padding: 16px; background: #2a2a2a; border-radius: 4px; border-left: 4px solid #7a9ac4\">\n<div style=\"min-width: 130px\">\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; color: #fff; font-weight: 600\">KKR<\u002Fdiv>\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 11px; color: #888\">EE. UU. · Capital riesgo<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex: 1; display: flex; flex-wrap: wrap; gap: 8px\">\n<div style=\"padding: 6px 12px; background: #333; border-radius: 3px; font-family: 'IBM Plex Sans', sans-serif; font-size: 12px; color: #fff\">HCG <span style=\"color: #8fbc8f\">~54%<\u002Fspan><\u002Fdiv>\n<div style=\"padding: 6px 12px; background: #333; border-radius: 3px; font-family: 'IBM Plex Sans', sans-serif; font-size: 12px; color: #ccc\">Baby Memorial Hospital<\u002Fdiv>\n<div style=\"padding: 6px 12px; background: #333; border-radius: 3px; font-family: 'IBM Plex Sans', sans-serif; font-size: 12px; color: #ccc\">Medicover India<\u002Fdiv>\n<div style=\"padding: 6px 12px; background: #333; border-radius: 3px; font-family: 'IBM Plex Sans', sans-serif; font-size: 12px; color: #ccc\">Meitra Hospital<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; align-items: center; gap: 16px; padding: 16px; background: #2a2a2a; border-radius: 4px; border-left: 4px solid #9a7abc\">\n<div style=\"min-width: 130px\">\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; color: #fff; font-weight: 600\">CVC Capital<\u002Fdiv>\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 11px; color: #888\">Luxemburgo · Capital riesgo<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex: 1; display: flex; flex-wrap: wrap; gap: 8px\">\n<div style=\"padding: 6px 12px; background: #333; border-radius: 3px; font-family: 'IBM Plex Sans', sans-serif; font-size: 12px; color: #fff\">Medanta / Global Health<\u002Fdiv>\n<div style=\"padding: 6px 12px; background: #333; border-radius: 3px; font-family: 'IBM Plex Sans', sans-serif; font-size: 12px; color: #888\">HCG <span style=\"font-style: italic\">salida → KKR<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; align-items: center; gap: 16px; padding: 16px; background: #2a2a2a; border-radius: 4px; border-left: 4px solid #bc7a7a\">\n<div style=\"min-width: 130px\">\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; color: #fff; font-weight: 600\">TPG<\u002Fdiv>\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 11px; color: #888\">EE. UU. · Capital riesgo<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex: 1; display: flex; flex-wrap: wrap; gap: 8px\">\n<div style=\"padding: 6px 12px; background: #333; border-radius: 3px; font-family: 'IBM Plex Sans', sans-serif; font
