        {
          "@type": "Question",
          "name": "¿Qué tamaño tiene el sector hospitalario indio?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "El mercado hospitalario indio valía unos 104.000 millones de dólares en 2025, frente a unos 99.000 millones en 2023, y crece entre un 7 % y un 8 % anual. Las previsiones varían según el alcance y la metodología: IBEF/IMARC proyectan un aumento de 193.000 millones en 2025 a 365.000 millones en 2034, mientras que Ken Research prevé pasar de 124.000 a 197.000 millones en 2031."
          }
        },
        {
          "@type": "Question",
          "name": "¿Cuántos hospitales y camas hospitalarias tiene la India?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "La India cuenta con unos 54.000 hospitales y 1,3 millones de camas, frente a 43.500 hospitales y 1,1 millones de camas en 2019. Cerca de 38.000 son privados (en torno al 70 % de los centros) y unos 16.000 públicos. Con las camas ocurre lo contrario: los hospitales públicos concentran más de 710.000 camas (55 %) frente a unas 590.000 en manos privadas."
          }
        },
        {
          "@type": "Question",
          "name": "¿Cómo se compara la densidad de camas de la India con la de otros países?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "La India tiene unas 1,3 camas por cada 1.000 habitantes, frente a una mediana mundial de 2,9. Solo las camas públicas suponen 0,79 por cada 1.000, por debajo del objetivo de 2,0 de la Política Nacional de Salud de 2017. Japón se sitúa en 13,0, Corea del Sur en 12,6, China en 6,4 y Estados Unidos en 2,9. Cerrar la brecha hasta la mediana mundial exigiría unos 2,4 millones de camas adicionales."
          }
        },
        {
          "@type": "Question",
          "name": "¿Cuáles son las mayores cadenas hospitalarias de la India?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Por número de camas, Manipal Hospitals lidera con 13.037 camas y unos ingresos de 10.336 millones de rupias, seguida de Apollo Hospitals con 10.209 camas y 21.794 millones de rupias de ingresos en el ejercicio 2025, la mayor por facturación. KIMS supera las 8.000 camas, Narayana Health tiene 6.100, Fortis 5.554, Aster DM 5.449, Max Healthcare unas 5.000 y Medanta más de 2.800."
          }
        },
        {
          "@type": "Question",
          "name": "¿Qué es el ARPOB y qué cadena hospitalaria india tiene el más alto?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "ARPOB son las siglas en inglés de ingreso medio por cama ocupada y día, la medida estándar del poder de fijación de precios y de la calidad de la casuística en la gestión hospitalaria. Max Healthcare lidera con unas 77.800 rupias diarias, por delante de Fortis con 68.800, Manipal con 66.144 y Apollo con 60.588. Los operadores basados en volumen, como KIMS, se sitúan más abajo, en 39.158 rupias."
          }
        },
        {
          "@type": "Question",
          "name": "¿Qué márgenes EBITDA obtienen los hospitales indios?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Según India Ratings, se prevén márgenes EBITDA del 20,9 % para todo el sector en el ejercicio 2026. Max Healthcare lidera con cerca del 35 %, seguida de Medanta con un 28 % aproximado, Manipal y KIMS en torno al 26 %, Narayana con un 25 %, Fortis con un 22 % y Apollo y Aster DM alrededor del 20 %. La madurez importa: los hospitales con más de siete años suelen ofrecer entre un 22 % y un 25 %, mientras que los nuevos aún en rodaje se quedan por debajo del 10 %."
          }
        },
        {
          "@type": "Question",
          "name": "¿Qué tasas de ocupación registran las cadenas hospitalarias indias?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "La ocupación se sitúa por lo general en una franja del 60 % al 75 %. Max Healthcare alcanza la más alta con un 76 %, seguida de Narayana y Fortis con un 68 %, Apollo con un 67 %, KIMS en torno al 65 %, Manipal con un 64 %, Medanta con un 62 % y Aster DM con un 61 %. Dado que los costes hospitalarios son en gran medida fijos, cada punto de ocupación por encima del 65 % aproximadamente aporta de forma desproporcionada al margen."
          }
        },
        {
          "@type": "Question",
          "name": "¿Se permite el 100 % de IED en los hospitales indios?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Sí. Los hospitales admiten inversión extranjera directa del 100 % por vía automática desde enero de 2000, sin necesidad de autorización previa del Gobierno. El diagnóstico, la anatomía patológica, los productos sanitarios y la farmacia de obra nueva también permiten el 100 % por esta vía. La farmacia sobre activos existentes está limitada al 74 % automático, y el seguro de salud al 74 %, con una propuesta para elevarlo al 100 %."
          }
        },
        {
          "@type": "Question",
          "name": "¿Cuánto capital riesgo ha entrado en la sanidad india?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Los fondos globales de capital riesgo y soberanos invirtieron 15.500 millones de dólares en la sanidad india entre 2019 y 2024, con un máximo de 5.500 millones en 2023. Los hospitales absorbieron el 68 % de ese capital, incluidos 4.960 millones entre 2022 y 2024. Casi la mitad de las principales cadenas hospitalarias del país están hoy en manos de capital riesgo internacional, y desinversiones como el 5,6× de KKR en Max Healthcare o el 3,4× de CVC en HCG siguen atrayendo capital."
          }
        },
        {
          "@type": "Question",
          "name": "¿Qué tamaño tiene el mercado del turismo médico en la India?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "El mercado indio de turismo médico valía unos 7.690 millones de dólares en 2024 y se prevé que crezca a más del 13 % anual compuesto. Las llegadas de pacientes extranjeros para tratamiento pasaron de 182.945 en 2020 a 644.387 en 2024. La ventaja principal es el precio: los tratamientos cuestan entre el 10 % y el 20 % de sus equivalentes occidentales, con una cirugía de baipás coronario en torno a 7.000 dólares en la India frente a 123.000 en Estados Unidos y 64.000 en el Reino Unido."
          }
        },
        {
          "@type": "Question",
          "name": "¿Cuántos indios tienen cobertura sanitaria?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Alrededor del 60 % de la población cuenta con cobertura neta única. Ayushman Bharat cubre a unos 550 millones de personas, los programas estatales a otros 250 millones y el seguro privado a unos 200 millones, con un solapamiento notable entre ellos. Cerca de 400 millones de indios siguen sin seguro. El gasto de bolsillo ha caído con fuerza, del 64,2 % del gasto sanitario en el ejercicio 2015 al 39,4 % en el de 2022."
          }
        },
        {
          "@type": "Question",
          "name": "¿Cuánto cuesta poner en marcha un hospital en la India?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "La economía de la puesta en marcha depende de la inversión de capital por cama, que varía mucho según el nivel de la ciudad y la complejidad asistencial. La inversión de capital cubre el suelo, la construcción, el equipamiento médico y la instalación, mientras que el gasto operativo está dominado por el personal, los consumibles y la farmacia. Los hospitales nuevos suelen registrar márgenes EBITDA inferiores al 10 % hasta alcanzar la madurez, y el punto de equilibrio depende de la rapidez con que suba la ocupación."
          }
        }

     {\n          \"@type\": \"WebPageElement\",\n          \"name\": \"Hospital Infrastructure\",\n          \"url\": \"https://health.wisemelon.ai/es/indian-hospital-industry-research-2026#hospital-infrastructure\"\n        },\n        {\n          \"@type\": \"WebPageElement\",\n          \"name\": \"Hospital Chains & Competitive Landscape\",\n          \"url\": \"https://health.wisemelon.ai/es/indian-hospital-industry-research-2026#hospital-chains\"\n        },\n        {\n          \"@type\": \"WebPageElement\",\n          \"name\": \"Hospital Performance Dashboard\",\n          \"url\": \"https://health.wisemelon.ai/es/indian-hospital-industry-research-2026#performance-dashboard\"\n        },\n        {\n          \"@type\": \"WebPageElement\",\n          \"name\": \"Hospital Economics\",\n          \"url\": \"https://health.wisemelon.ai/es/indian-hospital-industry-research-2026#hospital-economics\"\n        },\n        {\n          \"@type\": \"WebPageElement\",\n          \"name\": \"Revenue by Specialty\",\n          \"url\": \"https://health.wisemelon.ai/es/indian-hospital-industry-research-2026#revenue-by-specialty\"\n        },\n        {\n          \"@type\": \"WebPageElement\",\n          \"name\": \"Setup vs Operating Costs\",\n          \"url\": \"https://health.wisemelon.ai/es/indian-hospital-industry-research-2026#setup-vs-operating-costs\"\n        },\n        {\n          \"@type\": \"WebPageElement\",\n          \"name\": \"Patient Journey\",\n          \"url\": \"https://health.wisemelon.ai/es/indian-hospital-industry-research-2026#patient-journey\"\n        },\n        {\n          \"@type\": \"WebPageElement\",\n          \"name\": \"Insurance & Payer Ecosystem\",\n          \"url\": \"https://health.wisemelon.ai/es/indian-hospital-industry-research-2026#insurance-payers\"\n        },\n        {\n          \"@type\": \"WebPageElement\",\n          \"name\": \"Workforce & Staffing\",\n          \"url\": \"https://health.wisemelon.ai/es/indian-hospital-industry-research-2026#workforce-staffing\"\n        },\n        {\n          \"@type\": \"WebPageElement\",\n          \"name\": \"Technology & AI\",\n          \"url\": \"https://health.wisemelon.ai/es/indian-hospital-industry-research-2026#technology-ai\"\n        },\n        {\n          \"@type\": \"WebPageElement\",\n          \"name\": \"Medical Tourism\",\n          \"url\": \"https://health.wisemelon.ai/es/indian-hospital-industry-research-2026#medical-tourism\"\n        },\n        {\n          \"@type\": \"WebPageElement\",\n          \"name\": \"Investments & Foreign Capital\",\n          \"url\": \"https://health.wisemelon.ai/es/indian-hospital-industry-research-2026#investments-fdi\"\n        },\n        {\n          \"@type\": \"WebPageElement\",\n          \"name\": \"Market Outlook & Opportunities\",\n          \"url\": \"https://health.wisemelon.ai/es/indian-hospital-industry-research-2026#market-outlook\"\n        }\n      ]\n    },\n    {\n      \"@type\": \"FAQPage\",\n      \"@id\": \"https://health.wisemelon.ai/indian-hospital-industry-research-2026#faq\",\n      \"mainEntity\": [\n        {\n          \"@type\": \"Question\",\n          \"name\": \"¿Qué tamaño tiene el sector hospitalario indio?\",\n          \"acceptedAnswer\": {\n            \"@type\": \"Answer\",\n            \"text\": \"El mercado hospitalario indio valía unos 104.000 millones de dólares en 2025, frente a unos 99.000 millones en 2023, y crece entre un 7 % y un 8 % anual. Las previsiones varían según el alcance y la metodología: IBEF/IMARC proyectan un aumento de 193.000 millones en 2025 a 365.000 millones en 2034, mientras que Ken Research prevé pasar de 124.000 a 197.000 millones en 2031.\"\n          }\n        },\n        {\n          \"@type\": \"Question\",\n          \"name\": \"¿Cuántos hospitales y camas hospitalarias tiene la India?\",\n          \"acceptedAnswer\": {\n            \"@type\": \"Answer\",\n            \"text\": \"La India cuenta con unos 54.000 hospitales y 1,3 millones de camas, frente a 43.500 hospitales y 1,1 millones de camas en 2019. Cerca de 38.000 son privados (en torno al 70 % de los centros) y unos 16.000 públicos. Con las camas ocurre lo contrario: los hospitales públicos concentran más de 710.000 camas (55 %) frente a unas 590.000 en manos privadas.\"\n          }\n        },\n        {\n          \"@type\": \"Question\",\n          \"name\": \"¿Cómo se compara la densidad de camas de la India con la de otros países?\",\n          \"acceptedAnswer\": {\n            \"@type\": \"Answer\",\n            \"text\": \"La India tiene unas 1,3 camas por cada 1.000 habitantes, frente a una mediana mundial de 2,9. Solo las camas públicas suponen 0,79 por cada 1.000, por debajo del objetivo de 2,0 de la Política Nacional de Salud de 2017. Japón se sitúa en 13,0, Corea del Sur en 12,6, China en 6,4 y Estados Unidos en 2,9. Cerrar la brecha hasta la mediana mundial exigiría unos 2,4 millones de camas adicionales.\"\n          }\n        },\n        {\n          \"@type\": \"Question\",\n          \"name\": \"¿Cuáles son las mayores cadenas hospitalarias de la India?\",\n          \"acceptedAnswer\": {\n            \"@type\": \"Answer\",\n            \"text\": \"Por número de camas, Manipal Hospitals lidera con 13.037 camas y unos ingresos de 10.336 millones de rupias, seguida de Apollo Hospitals con 10.209 camas y 21.794 millones de rupias de ingresos en el ejercicio 2025, la mayor por facturación. KIMS supera las 8.000 camas, Narayana Health tiene 6.100, Fortis 5.554, Aster DM 5.449, Max Healthcare unas 5.000 y Medanta más de 2.800.\"\n          }\n        },\n        {\n          \"@type\": \"Question\",\n          \"name\": \"¿Qué es el ARPOB y qué cadena hospitalaria india tiene el más alto?\",\n          \"acceptedAnswer\": {\n            \"@type\": \"Answer\",\n            \"text\": \"ARPOB son las siglas en inglés de ingreso medio por cama ocupada y día, la medida estándar del poder de fijación de precios y de la calidad de la casuística en la gestión hospitalaria. Max Healthcare lidera con unas 77.800 rupias diarias, por delante de Fortis con 68.800, Manipal con 66.144 y Apollo con 60.588. Los operadores basados en volumen, como KIMS, se sitúan más abajo, en 39.158 rupias.\"\n          }\n        },\n        {\n          \"@type\": \"Question\",\n          \"name\": \"¿Qué márgenes EBITDA obtienen los hospitales indios?\",\n          \"acceptedAnswer\": {\n            \"@type\": \"Answer\",\n            \"text\": \"Según India Ratings, se prevén márgenes EBITDA del 20,9 % para todo el sector en el ejercicio 2026. Max Healthcare lidera con cerca del 35 %, seguida de Medanta con un 28 % aproximado, Manipal y KIMS en torno al 26 %, Narayana con un 25 %, Fortis con un 22 % y Apollo y Aster DM alrededor del 20 %. La madurez importa: los hospitales con más de siete años suelen ofrecer entre un 22 % y un 25 %, mientras que los nuevos aún en rodaje se quedan por debajo del 10 %.\"\n          }\n        },\n        {\n          \"@type\": \"Question\",\n          \"name\": \"¿Qué tasas de ocupación registran las cadenas hospitalarias indias?\",\n          \"acceptedAnswer\": {\n            \"@type\": \"Answer\",\n            \"text\": \"La ocupación se sitúa por lo general en una franja del 60 % al 75 %. Max Healthcare alcanza la más alta con un 76 %, seguida de Narayana y Fortis con un 68 %, Apollo con un 67 %, KIMS en torno al 65 %, Manipal con un 64 %, Medanta con un 62 % y Aster DM con un 61 %. Dado que los costes hospitalarios son en gran medida fijos, cada punto de ocupación por encima del 65 % aproximadamente aporta de forma desproporcionada al margen.\"\n          }\n        },\n        {\n          \"@type\": \"Question\",\n          \"name\": \"¿Se permite el 100 % de IED en los hospitales indios?\",\n          \"acceptedAnswer\": {\n            \"@type\": \"Answer\",\n            \"text\": \"Sí. Los hospitales admiten inversión extranjera directa del 100 % por vía automática desde enero de 2000, sin necesidad de autorización previa del Gobierno. El diagnóstico, la anatomía patológica, los productos sanitarios y la farmacia de obra nueva también permiten el 100 % por esta vía. La farmacia sobre activos existentes está limitada al 74 % automático, y el seguro de salud al 74 %, con una propuesta para elevarlo al 100 %.\"\n          }\n        },\n        {\n          \"@type\": \"Question\",\n          \"name\": \"¿Cuánto capital riesgo ha entrado en la sanidad india?\",\n          \"acceptedAnswer\": {\n            \"@type\": \"Answer\",\n            \"text\": \"Los fondos globales de capital riesgo y soberanos invirtieron 15.500 millones de dólares en la sanidad india entre 2019 y 2024, con un máximo de 5.500 millones en 2023. Los hospitales absorbieron el 68 % de ese capital, incluidos 4.960 millones entre 2022 y 2024. Casi la mitad de las principales cadenas hospitalarias del país están hoy en manos de capital riesgo internacional, y desinversiones como el 5,6× de KKR en Max Healthcare o el 3,4× de CVC en HCG siguen atrayendo capital.\"\n          }\n        },\n        {\n          \"@type\": \"Question\",\n          \"name\": \"¿Qué tamaño tiene el mercado del turismo médico en la India?\",\n          \"acceptedAnswer\": {\n            \"@type\": \"Answer\",\n            \"text\": \"El mercado indio de turismo médico valía unos 7.690 millones de dólares en 2024 y se prevé que crezca a más del 13 % anual compuesto. Las llegadas de pacientes extranjeros para tratamiento pasaron de 182.945 en 2020 a 644.387 en 2024. La ventaja principal es el precio: los tratamientos cuestan entre el 10 % y el 20 % de sus equivalentes occidentales, con una cirugía de baipás coronario en torno a 7.000 dólares en la India frente a 123.000 en Estados Unidos y 64.000 en el Reino Unido.\"\n          }\n        },\n        {\n          \"@type\": \"Question\",\n          \"name\": \"¿Cuántos indios tienen cobertura sanitaria?\",\n          \"acceptedAnswer\": {\n            \"@type\": \"Answer\",\n            \"text\": \"Alrededor del 60 % de la población cuenta con cobertura neta única. Ayushman Bharat cubre a unos 550 millones de personas, los programas estatales a otros 250 millones y el seguro privado a unos 200 millones, con un solapamiento notable entre ellos. Cerca de 400 millones de indios siguen sin seguro. El gasto de bolsillo ha caído con fuerza, del 64,2 % del gasto sanitario en el ejercicio 2015 al 39,4 % en el de 2022.\"\n          }\n        },\n        {\n          \"@type\": \"Question\",\n          \"name\": \"¿Cuánto cuesta poner en marcha un hospital en la India?\",\n          \"acceptedAnswer\": {\n            \"@type\": \"Answer\",\n            \"text\": \"La economía de la puesta en marcha depende de la inversión de capital por cama, que varía mucho según el nivel de la ciudad y la complejidad asistencial. La inversión de capital cubre el suelo, la construcción, el equipamiento médico y la instalación, mientras que el gasto operativo está dominado por el personal, los consumibles y la farmacia. Los hospitales nuevos suelen registrar márgenes EBITDA inferiores al 10 % hasta alcanzar la madurez, y el punto de equilibrio depende de la rapidez con que suba la ocupación.\"\n          }\n        }\n      ]\n    },\n    {\n      \"@type\": \"BreadcrumbList\",\n      \"itemListElement\": [\n        {\n          \"@type\": \"ListItem\",\n          \"position\": 1,\n          \"name\": \"Wisemelon Health\",\n          \"item\": \"https://health.wisemelon.ai\"\n        },\n        {\n          \"@type\": \"ListItem\",\n          \"position\": 2,\n          \"name\": \"El sector hospitalario indio\",\n          \"item\": \"https://health.wisemelon.ai/es/indian-hospital-industry-research-2026\"\n        }\n      ]\n    }\n  ]\n}<\u002Fscript><\u002Fhelmet>\n<a class=\"wm-skip\" href=\"#main-content\">Ir al contenido del informe<\u002Fa><main id=\"main-content\" style=\"max-width: 960px; margin: 0 auto; padding: 0 clamp(16px, 4vw, 32px) clamp(56px, 10vw, 120px)\"><article>\n<!-- HERO -->\n<header aria-labelledby=\"report-header-heading\" id=\"report-header\" style=\"padding: 80px 0 60px; border-bottom: 2px solid #1a1a1a\">\n<div class=\"wm-topbar\"><div style=\"display: flex; flex-direction: column; align-items: flex-start; gap: 6px; margin-bottom: 32px\">\n<img alt=\"Wisemelon Research\" decoding=\"async\" height=\"28\" src=\"bc5d843c-2928-4220-b7c6-ae02d8e932a5\" style=\"height: 28px; object-fit: contain; display: block\" width=\"129\"/>\n<span style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 12px; font-weight: 400; letter-spacing: 7px; text-transform: uppercase; color: #1a1a1a; line-height: 1; padding-left: 10px\">Investigación<\u002Fspan>\n<\u002Fdiv><div aria-label=\"Choose language\" class=\"wm-lang\" role=\"navigation\"><a href=\"https://health.wisemelon.ai/indian-hospital-industry-research-2026\" hreflang=\"en\" lang=\"en\">English<\u002Fa><a href=\"https://health.wisemelon.ai/zh/indian-hospital-industry-research-2026\" hreflang=\"zh-Hans\" lang=\"zh\">中文<\u002Fa><a dir=\"rtl\" href=\"https://health.wisemelon.ai/ar/indian-hospital-industry-research-2026\" hreflang=\"ar\" lang=\"ar\">العربية<\u002Fa><a aria-current=\"true\" href=\"https://health.wisemelon.ai/es/indian-hospital-industry-research-2026\" hreflang=\"es\" lang=\"es\">Español<\u002Fa><\u002Fdiv><\u002Fdiv>\n<div style=\"font-family: 'IBM Plex Sans', Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 600; letter-spacing: 3px; text-transform: uppercase; color: #3a5a40; margin-bottom: 24px\">Informe de inteligencia sectorial · 2026<\u002Fdiv>\n<h1 id=\"report-header-heading\" style=\"font-family: Georgia, 'Times New Roman', serif; font-size: clamp(2rem, 7.2vw, 3.5rem); font-weight: 400; line-height: 1.1; color: #1a1a1a; margin: 0 0 24px; max-width: 780px\">El sector hospitalario indio<\u002Fh1>\n<p style=\"font-family: Georgia, serif; font-size: clamp(1.05rem, 2.6vw, 1.25rem); line-height: 1.6; color: #555; margin: 0; max-width: 640px\">Un análisis exhaustivo del tamaño de mercado, el panorama competitivo, la economía hospitalaria, el recorrido del paciente, el ecosistema asegurador y las oportunidades emergentes en el sector hospitalario indio, de más de 100.000 millones de dólares.<\u002Fp>\n<\u002Fheader>\n<!-- KEY NUMBERS -->\n<section id=\"headline-numbers\" style=\"padding: 56px 0; border-bottom: 1px solid #e0ddd8\">\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 11px; font-weight: 600; letter-spacing: 3px; text-transform: uppercase; color: #3a5a40; margin-bottom: 32px\">Cifras principales<\u002Fdiv>\n<div class=\"wm-grid\" style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(150px, 100%), 1fr)); gap: 32px\">\n<div>\n<div style=\"font-family: Georgia, serif; font-size: clamp(1.6rem, 5.4vw, 2.625rem); color: #1a1a1a; line-height: 1\">$104B<\u002Fdiv>\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 13px; color: #777; margin-top: 8px; line-height: 1.4\">Tamaño del mercado hospitalario (2025)<\u002Fdiv>\n<\u002Fdiv>\n<div>\n<div style=\"font-family: Georgia, serif; font-size: clamp(1.6rem, 5.4vw, 2.625rem); color: #1a1a1a; line-height: 1\">54,000<\u002Fdiv>\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 13px; color: #777; margin-top: 8px; line-height: 1.4\">Hospitales en todo el país<\u002Fdiv>\n<\u002Fdiv>\n<div>\n<div style=\"font-family: Georgia, serif; font-size: clamp(1.6rem, 5.4vw, 2.625rem); color: #1a1a1a; line-height: 1\">1.3M<\u002Fdiv>\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 13px; color: #777; margin-top: 8px; line-height: 1.4\">Camas hospitalarias totales<\u002Fdiv>\n<\u002Fdiv>\n<div>\n<div style=\"font-family: Georgia, serif; font-size: clamp(1.6rem, 5.4vw, 2.625rem); color: #1a1a1a; line-height: 1\">7–8%<\u002Fdiv>\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 13px; color: #777; margin-top: 8px; line-height: 1.4\">TCAC anual del mercado<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n<!-- TABLE OF CONTENTS -->\n<section aria-labelledby=\"key-takeaways-heading\" id=\"key-takeaways\" style=\"padding: 48px 0; border-bottom: 1px solid #e0ddd8\">\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 11px; font-weight: 600; letter-spacing: 3px; text-transform: uppercase; color: #3a5a40; margin-bottom: 24px\">Conclusiones clave<\u002Fdiv>\n<h2 id=\"key-takeaways-heading\" style=\"font-family: Georgia, 'Times New Roman', serif; font-weight: 400;\n             font-size: clamp(1.45rem, 4.8vw, 2.25rem); color: #1a1a1a; margin: 0 0 24px;\n             line-height: 1.2\">\n    El sector hospitalario indio en siete cifras\n  <\u002Fh2>\n<ul class=\"wm-takeaways\">\n<li>El mercado hospitalario indio alcanzó <strong>104.000 millones de dólares en 2025<\u002Fstrong> y crece a un ritmo del <strong>7-8 % anual<\u002Fstrong>, con previsiones que llegan a 193.000-365.000 millones de dólares a mediados de la década de 2030 según el alcance considerado.<\u002Fli><li>El país cuenta con <strong>54.000 hospitales y 1,3 millones de camas<\u002Fstrong>, pero solo <strong>1,3 camas por cada 1.000 habitantes<\u002Fstrong> frente a una mediana mundial de 2,9: un déficit de aproximadamente 2,4 millones de camas.<\u002Fli><li>Los operadores privados gestionan el <strong>70 % de los centros<\u002Fstrong> pero solo poseen el 45 % de las camas; las cadenas organizadas representan una pequeña parte de los hospitales, pero dominan en ingresos, marca y crecimiento.<\u002Fli><li><strong>Max Healthcare lidera en ARPOB<\u002Fstrong> (77.800 rupias/día) y en margen EBITDA (~35 %), lo que demuestra que la calidad de los ingresos puede pesar más que la escala: Apollo lidera en ingresos absolutos con 21.794 millones de rupias.<\u002Fli><li><strong>El gasto de bolsillo cayó del 64,2 % al 39,4 %<\u002Fstrong> del gasto sanitario entre los ejercicios 2015 y 2022, a medida que Ayushman Bharat y los seguros privados ampliaron la cobertura a cerca del 60 % de la población.<\u002Fli><li>El capital riesgo mundial ha invertido <strong>15.500 millones de dólares en la sanidad india desde 2019<\u002Fstrong>, el 68 % de ellos en hospitales, favorecido por <strong>la IED del 100 % por vía automática<\u002Fstrong> vigente desde el año 2000.<\u002Fli><li>El turismo médico alcanzó <strong>7.700 millones de dólares en 2024<\u002Fstrong> con 644.387 llegadas de pacientes extranjeros, sostenido por costes de tratamiento del 10-20 % de los precios occidentales.<\u002Fli>\n<\u002Ful>\n<\u002Fsection>\n<nav aria-label=\"Table of contents\" class=\"wm-toc-wrap\" id=\"contents\" style=\"padding: 48px 0; border-bottom: 1px solid #e0ddd8\">\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 11px; font-weight: 600; letter-spacing: 3px; text-transform: uppercase; color: #3a5a40; margin-bottom: 24px\">Contenido<\u002Fdiv>\n<div class=\"wm-grid\" style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(265px, 100%), 1fr)); gap: 12px 48px\">\n<a class=\"wm-toc-link\" href=\"#healthcare-landscape\" style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 15px; color: #1a1a1a; padding: 8px 0; border-bottom: 1px solid #eee; text-decoration: none\"><span class=\"wm-toc-num\" style=\"color: #999; margin-right: 12px\">01<\u002Fspan>Panorama sanitario<\u002Fa>\n<a class=\"wm-toc-link\" href=\"#insurance-payers\" style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 15px; color: #1a1a1a; padding: 8px 0; border-bottom: 1px solid #eee; text-decoration: none\"><span class=\"wm-toc-num\" style=\"color: #999; margin-right: 12px\">08<\u002Fspan>Seguros y pagadores<\u002Fa>\n<a class=\"wm-toc-link\" href=\"#market-size-growth\" style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 15px; color: #1a1a1a; padding: 8px 0; border-bottom: 1px solid #eee; text-decoration: none\"><span class=\"wm-toc-num\" style=\"color: #999; margin-right: 12px\">02<\u002Fspan>Tamaño y crecimiento del mercado<\u002Fa>\n<a class=\"wm-toc-link\" href=\"#workforce-staffing\" style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 15px; color: #1a1a1a; padding: 8px 0; border-bottom: 1px solid #eee; text-decoration: none\"><span class=\"wm-toc-num\" style=\"color: #999; margin-right: 12px\">09<\u002Fspan>Personal y plantilla<\u002Fa>\n<a class=\"wm-toc-link\" href=\"#hospital-infrastructure\" style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 15px; color: #1a1a1a; padding: 8px 0; border-bottom: 1px solid #eee; text-decoration: none\"><span class=\"wm-toc-num\" style=\"color: #999; margin-right: 12px\">03<\u002Fspan>Infraestructura hospitalaria<\u002Fa>\n<a class=\"wm-toc-link\" href=\"#technology-ai\" style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 15px; color: #1a1a1a; padding: 8px 0; border-bottom: 1px solid #eee; text-decoration: none\"><span class=\"wm-toc-num\" style=\"color: #999; margin-right: 12px\">10<\u002Fspan>Tecnología e IA<\u002Fa>\n<a class=\"wm-toc-link\" href=\"#hospital-chains\" style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 15px; color: #1a1a1a; padding: 8px 0; border-bottom: 1px solid #eee; text-decoration: none\"><span class=\"wm-toc-num\" style=\"color: #999; margin-right: 12px\">04<\u002Fspan>Cadenas hospitalarias<\u002Fa>\n<a class=\"wm-toc-link\" href=\"#medical-tourism\" style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 15px; color: #1a1a1a; padding: 8px 0; border-bottom: 1px solid #eee; text-decoration: none\"><span class=\"wm-toc-num\" style=\"color: #999; margin-right: 12px\">11<\u002Fspan>Turismo médico<\u002Fa>\n<a class=\"wm-toc-link\" href=\"#performance-dashboard\" style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 15px; color: #1a1a1a; padding: 8px 0; border-bottom: 1px solid #eee; text-decoration: none\"><span class=\"wm-toc-num\" style=\"color: #999; margin-right: 12px\">04b<\u002Fspan>Panel de rendimiento<\u002Fa>\n<a class=\"wm-toc-link\" href=\"#investments-fdi\" style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 15px; color: #1a1a1a; padding: 8px 0; border-bottom: 1px solid #eee; text-decoration: none\"><span class=\"wm-toc-num\" style=\"color: #999; margin-right: 12px\">12<\u002Fspan>Inversiones e IED<\u002Fa>\n<a class=\"wm-toc-link\" href=\"#hospital-economics\" style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 15px; color: #1a1a1a; padding: 8px 0; border-bottom: 1px solid #eee; text-decoration: none\"><span class=\"wm-toc-num\" style=\"color: #999; margin-right: 12px\">05<\u002Fspan>Economía hospitalaria<\u002Fa>\n<a class=\"wm-toc-link\" href=\"#market-outlook\" style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 15px; color: #1a1a1a; padding: 8px 0; border-bottom: 1px solid #eee; text-decoration: none\"><span class=\"wm-toc-num\" style=\"color: #999; margin-right: 12px\">13<\u002Fspan>Perspectivas del mercado<\u002Fa>\n<a class=\"wm-toc-link\" href=\"#revenue-by-specialty\" style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 15px; color: #1a1a1a; padding: 8px 0; border-bottom: 1px solid #eee; text-decoration: none\"><span class=\"wm-toc-num\" style=\"color: #999; margin-right: 12px\">05b<\u002Fspan>Ingresos por especialidad<\u002Fa>\n<a class=\"wm-toc-link\" href=\"#setup-vs-operating-costs\" style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 15px; color: #1a1a1a; padding: 8px 0; border-bottom: 1px solid #eee; text-decoration: none\"><span class=\"wm-toc-num\" style=\"color: #999; margin-right: 12px\">06<\u002Fspan>Costes de puesta en marcha frente a operativos<\u002Fa>\n<a class=\"wm-toc-link\" href=\"#sources\" style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 15px; color: #1a1a1a; padding: 8px 0; border-bottom: 1px solid #eee; text-decoration: none\"><span class=\"wm-toc-num\" style=\"color: #999; margin-right: 12px\">14<\u002Fspan>Fuentes<\u002Fa>\n<a class=\"wm-toc-link\" href=\"#patient-journey\" style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 15px; color: #1a1a1a; padding: 8px 0; border-bottom: 1px solid #eee; text-decoration: none\"><span class=\"wm-toc-num\" style=\"color: #999; margin-right: 12px\">07<\u002Fspan>Recorrido del paciente<\u002Fa>\n<\u002Fdiv>\n<\u002Fnav>\n<!-- SECTION 01: HEALTHCARE LANDSCAPE -->\n<section aria-labelledby=\"healthcare-landscape-heading\" id=\"healthcare-landscape\" style=\"padding: 64px 0 0\">\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 11px; font-weight: 600; letter-spacing: 3px; text-transform: uppercase; color: #3a5a40; margin-bottom: 16px\">01<\u002Fdiv>\n<h2 id=\"healthcare-landscape-heading\" style=\"font-family: Georgia, serif; font-size: clamp(1.45rem, 4.8vw, 2.25rem); font-weight: 400; color: #1a1a1a; margin: 0 0 32px; line-height: 1.2\">Panorama sanitario<\u002Fh2>\n<p style=\"font-family: Georgia, serif; font-size: 17px; line-height: 1.8; color: #333; margin: 0 0 24px\">El sistema sanitario indio es un modelo mixto público-privado que atiende a 1.400 millones de personas. El gasto sanitario total alcanzó los 9,04 billones de rupias (3,8 % del PIB) en el ejercicio 2022, o aproximadamente 6.602 rupias per cápita a precios corrientes. El gasto sanitario público ha aumentado del 1,28 % del PIB en el ejercicio 2019 al 1,9 % en el ejercicio 2024, todavía por debajo del objetivo del 2,5 % fijado por la Política Nacional de Salud de 2017.<\u002Fp>\n<p style=\"font-family: Georgia, serif; font-size: 17px; line-height: 1.8; color: #333; margin: 0 0 24px\">Entre los ejercicios 2015 y 2022, la participación pública en el gasto sanitario total pasó del 29 % al 48 %, mientras que el gasto de bolsillo cayó del 64,2 % al 39,4 %: un cambio estructural significativo impulsado por la ampliación de la cobertura aseguradora y los programas de salud pública.<\u002Fp>\n<!-- Pullquote -->\n<div style=\"border-left: 3px solid #3a5a40; padding: 24px 0 24px 32px; margin: 40px 0\">\n<div style=\"font-family: Georgia, serif; font-size: clamp(1.25rem, 3.8vw, 1.75rem); line-height: 1.4; color: #1a1a1a\">Se espera que el gasto sanitario de la India pase del 3,3 % al 5 % del PIB en 2030.<\u002Fdiv>\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 12px; color: #999; margin-top: 12px; letter-spacing: 1px; text-transform: uppercase\">CareEdge Ratings, 2024<\u002Fdiv>\n<\u002Fdiv>\n<p style=\"font-family: Georgia, serif; font-size: 17px; line-height: 1.8; color: #333; margin: 0 0 24px\">El mercado sanitario se divide en hospitales y clínicas (40 % del total), diagnóstico, telesalud, seguros de salud y turismo médico. Los hospitales y clínicas dominan gracias al fuerte crecimiento de las cadenas hospitalarias privadas, la urbanización y la demanda de atención terciaria asequible. El panorama sanitario indio está impulsado por las grandes metrópolis (Bombay, Delhi-NCR, Bangalore, Chennai) y, cada vez más, por ciudades secundarias.<\u002Fp>\n<div class=\"wm-grid\" style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(265px, 100%), 1fr)); gap: 24px; margin: 40px 0; padding: 32px; background: #f0eeea; border-radius: 4px\">\n<div>\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 12px; color: #777; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px\">Población<\u002Fdiv>\n<div style=\"font-family: Georgia, serif; font-size: clamp(1.25rem, 3.8vw, 1.75rem); color: #1a1a1a\">1.440 millones<\u002Fdiv>\n<\u002Fdiv>\n<div>\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 12px; color: #777; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px\">Mercado sanitario total<\u002Fdiv>\n<div style=\"font-family: Georgia, serif; font-size: clamp(1.25rem, 3.8vw, 1.75rem); color: #1a1a1a\">~$180B (2024)<\u002Fdiv>\n<\u002Fdiv>\n<div>\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 12px; color: #777; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px\">Sanidad como % del PIB<\u002Fdiv>\n<div style=\"font-family: Georgia, serif; font-size: clamp(1.25rem, 3.8vw, 1.75rem); color: #1a1a1a\">3.8%<\u002Fdiv>\n<\u002Fdiv>\n<div>\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 12px; color: #777; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px\">Gasto sanitario público (% del PIB)<\u002Fdiv>\n<div style=\"font-family: Georgia, serif; font-size: clamp(1.25rem, 3.8vw, 1.75rem); color: #1a1a1a\">1.9%<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<!-- INFOGRAPHIC: Out-of-Pocket Expenditure Decline -->\n<div class=\"wm-panel\" style=\"margin: 48px 0; padding: 40px; background: #1a1a1a; border-radius: 4px\">\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 11px; font-weight: 600; letter-spacing: 3px; text-transform: uppercase; color: #8fbc8f; margin-bottom: 32px\">Quién paga la sanidad: el reparto de la carga<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 20px\">\n<div>\n<div style=\"display: flex; justify-content: space-between; margin-bottom: 8px\">\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 13px; color: #999\">FY15<\u002Fdiv>\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 13px; color: #999\">Gasto de bolsillo: 64,2 %<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"height: 40px; background: #2a2a2a; border-radius: 3px; overflow: hidden; display: flex\">\n<div style=\"width: 29%; background: #3a5a40; display: flex; align-items: center; justify-content: center\">\n<span style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 11px; color: #fff; font-weight: 600\">Público 29 %<\u002Fspan>\n<\u002Fdiv>\n<div style=\"width: 6.8%; background: #5a7a60; display: flex; align-items: center; justify-content: center\">\n<\u002Fdiv>\n<div style=\"width: 64.2%; background: #c45a3c; display: flex; align-items: center; justify-content: center\">\n<span style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 11px; color: #fff; font-weight: 600\" 12px; background: #c45a3c; border-radius: 2px\"><\u002Fdiv><span style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 11px; color: #777\">Gasto de bolsillo<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n<!-- SECTION 02: MARKET SIZE -->\n<section aria-labelledby=\"market-size-growth-heading\" id=\"market-size-growth\" style=\"padding: 64px 0 0; border-top: 1px solid #e0ddd8\">\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 11px; font-weight: 600; letter-spacing: 3px; text-transform: uppercase; color: #3a5a40; margin-bottom: 16px\">02<\u002Fdiv>\n<h2 id=\"market-size-growth-heading\" style=\"font-family: Georgia, serif; font-size: clamp(1.45rem, 4.8vw, 2.25rem); font-weight: 400; color: #1a1a1a; margin: 0 0 32px; line-height: 1.2\">Tamaño y crecimiento del mercado<\u002Fh2>\n<p style=\"font-family: Georgia, serif; font-size: 17px; line-height: 1.8; color: #333; margin: 0 0 24px\">El mercado hospitalario indio se valoró en aproximadamente 98.980 millones de dólares en 2023 y figura entre los mercados sanitarios de más rápido crecimiento del mundo. Diversas firmas de investigación proyectan cifras distintas según el alcance y la metodología, pero la trayectoria de consenso es clara: un crecimiento sostenido de un dígito alto.<\u002Fp>\n<div class=\"wm-panel\" style=\"background: #1a1a1a; color: #fff; padding: 40px; border-radius: 4px; margin: 32px 0\">\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 11px; font-weight: 600; letter-spacing: 3px; text-transform: uppercase; color: #8fbc8f; margin-bottom: 24px\">Comparación de estimaciones de mercado<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 20px\">\n<div style=\"display: flex; justify-content: space-between; align-items: center; padding-bottom: 16px; border-bottom: 1px solid #333\">\n<div>\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; color: #ccc\">IBEF / IMARC Group<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"text-align: right\">\n<div style=\"font-family: Georgia, serif; font-size: clamp(1.15rem, 3.2vw, 1.5rem)\">$193B → $365B<\u002Fdiv>\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 12px; color: #888; margin-top: 4px\">2025-2034, TCAC del 7,3 %<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; justify-content: space-between; align-items: center; padding-bottom: 16px; border-bottom: 1px solid #333\">\n<div>\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; color: #ccc\">Ken Research<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"text-align: right\">\n<div style=\"font-family: Georgia, serif; font-size: clamp(1.15rem, 3.2vw, 1.5rem)\">$124B → $197B<\u002Fdiv>\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 12px; color: #888; margin-top: 4px\">2025-2031, TCAC del 8,0 %<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; justify-content: space-between; align-items: center; padding-bottom: 16px; border-bottom: 1px solid #333\">\n<div>\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; color: #ccc\">Expert Market Research<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"text-align: right\">\n<div style=\"font-family: Georgia, serif; font-size: clamp(1.15rem, 3.2vw, 1.5rem)\">$105B → $184B<\u002Fdiv>\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 12px; color: #888; margin-top: 4px\">2025-2035, TCAC del 5,8 %<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; justify-content: space-between; align-items: center\">\n<div>\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; color: #ccc\">TechSci Research<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"text-align: right\">\n<div style=\"font-family: Georgia, serif; font-size: clamp(1.15rem, 3.2vw, 1.5rem)\">→ $197B<\u002Fdiv>\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 12px; color: #888; margin-top: 4px\">Para 2030, TCAC del 10,6 %<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 12px; color: #666; margin-top: 24px; font-style: italic\">Nota: la variación refleja diferencias de alcance (solo servicios hospitalarios frente a sanidad en sentido amplio), de metodología y de inclusión de los ingresos de farmacia y diagnóstico.<\u002Fdiv>\n<\u002Fdiv>\n<!-- INFOGRAPHIC: Market Size Growth Trajectory -->\n<div class=\"wm-panel\" style=\"margin: 48px 0; padding: 40px 40px 32px; background: #f0eeea; border-radius: 4px\">\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 11px; font-weight: 600; letter-spacing: 3px; text-transform: uppercase; color: #3a5a40; margin-bottom: 32px\">Trayectoria del tamaño del mercado hospitalario (miles de millones de USD)<\u002Fdiv>\n<div style=\"display: flex; align-items: flex-end; gap: 0; height: 220px; padding-bottom: 32px; border-bottom: 2px solid #d0cdc8\">\n<div style=\"flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%\">\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 13px; font-weight: 600; color: #1a1a1a; margin-bottom: 6px\">$72B<\u002Fdiv>\n<div style=\"width: 100%; max-width: 56px; background: linear-gradient(180deg, #5a7a60 0%, #3a5a40 100%); border-radius: 3px 3px 0 0; height: 38%\"><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%\">\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 13px; font-weight: 600; color: #1a1a1a; margin-bottom: 6px\">$99B<\u002Fdiv>\n<div style=\"width: 100%; max-width: 56px; background: linear-gradient(180deg, #5a7a60 0%, #3a5a40 100%); border-radius: 3px 3px 0 0; height: 52%\"><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%\">\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 13px; font-weight: 600; color: #1a1a1a; margin-bottom: 6px\">$104B<\u002Fdiv>\n<div style=\"width: 100%; max-width: 56px; background: linear-gradient(180deg, #5a7a60 0%, #3a5a40 100%); border-radius: 3px 3px 0 0; height: 55%\"><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%\">\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 13px; font-weight: 600; color: #1a1a1a; margin-bottom: 6px\">$124B<\u002Fdiv>\n<div style=\"width: 100%; max-width: 56px; background: linear-gradient(180deg, #5a7a60 0%, #3a5a40 100%); border-radius: 3px 3px 0 0; height: 65%\"><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%\">\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 13px; font-weight: 600; color: #c45a3c; margin-bottom: 6px\">$193B<\u002Fdiv>\n<div style=\"width: 100%; max-width: 56px; background: linear-gradient(180deg, #d4725a 0%, #c45a3c 100%); border-radius: 3px 3px 0 0; height: 82%; opacity: 0.85\"><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%\">\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 13px; font-weight: 600; color: #c45a3c; margin-bottom: 6px\">$365B<\u002Fdiv>\n<div style=\"width: 100%; max-width: 56px; background: linear-gradient(180deg, #d4725a 0%, #c45a3c 100%); border-radius: 3px 3px 0 0; height: 100%; opacity: 0.85\"><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; gap: 0\">\n<div style=\"flex: 1; text-align: center; padding-top: 10px; font-family: 'IBM Plex Sans', sans-serif; font-size: 12px; color: #777\">2020<\u002Fdiv>\n<div style=\"flex: 1; text-align: center; padding-top: 10px; font-family: 'IBM Plex Sans', sans-serif; font-size: 12px; color: #777\">2023<\u002Fdiv>\n<div style=\"flex: 1; text-align: center; padding-top: 10px; font-family: 'IBM Plex Sans', sans-serif; font-size: 12px; color: #777\">2025<\u002Fdiv>\n<div style=\"flex: 1; text-align: center; padding-top: 10px; font-family: 'IBM Plex Sans', sans-serif; font-size: 12px; color: #777\">2027E<\u002Fdiv>\n<div style=\"flex: 1; text-align: center; padding-top: 10px; font-family: 'IBM Plex Sans', sans-serif; font-size: 12px; color: #777\">2030E<\u002Fdiv>\n<div style=\"flex: 1; text-align: center; padding-top: 10px; font-family: 'IBM Plex Sans', sans-serif; font-size: 12px; color: #777\">2034E<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; gap: 16px; margin-top: 16px; justify-content: center\">\n<div style=\"display: flex; align-items: center; gap: 6px\"><div style=\"width: 10px; height: 10px; background: #3a5a40; border-radius: 2px\"><\u002Fdiv><span style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 11px; color: #777\">Datos reales<\u002Fspan><\u002Fdiv>\n<div style=\"display: flex; align-items: center; gap: 6px\"><div style=\"width: 10px; height: 10px; background: #c45a3c; border-radius: 2px\"><\u002Fdiv><span style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 11px; color: #777\">Proyectado (IBEF / IMARC)<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<p style=\"font-family: Georgia, serif; font-size: 17px; line-height: 1.8; color: #333; margin: 0 0 24px\">El crecimiento responde a varios factores estructurales: una población de 1.400 millones con renta per cápita creciente, una mayor carga de enfermedades crónicas, el compromiso del Gobierno con la cobertura sanitaria universal a través de Ayushman Bharat, la competitividad del turismo médico (con costes del 10-20 % de los occidentales) y una urbanización continua que genera demanda de infraestructura hospitalaria organizada.<\u002Fp>\n<p style=\"font-family: Georgia, serif; font-size: 17px; line-height: 1.8; color: #333; margin: 0 0 24px\">La mayor expansión anual se produjo en 2024, con un 14,14 %, reflejo de la normalización de los procedimientos electivos tras la COVID, la ampliación de capacidad de las cadenas organizadas y la mejora de los ingresos por cama. A diferencia de etapas anteriores, en las que el crecimiento venía de los precios, los hospitales se benefician cada vez más de mayores volúmenes de pacientes y de una combinación de tratamientos más rentable.<\u002Fp>\n<\u002Fsection>\n<!-- SECTION 03: HOSPITAL INFRASTRUCTURE -->\n<section aria-labelledby=\"hospital-infrastructure-heading\" id=\"hospital-infrastructure\" style=\"padding: 64px 0 0; border-top: 1px solid #e0ddd8\">\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 11px; font-weight: 600; letter-spacing: 3px; text-transform: uppercase; color: #3a5a40; margin-bottom: 16px\">03<\u002Fdiv>\n<h2 id=\"hospital-infrastructure-heading\" style=\"font-family: Georgia, serif; font-size: clamp(1.45rem, 4.8vw, 2.25rem); font-weight: 400; color: #1a1a1a; margin: 0 0 32px; line-height: 1.2\">Infraestructura hospitalaria<\u002Fh2>\n<!-- INFOGRAPHIC: Public vs Private Split -->\n<div class=\"wm-grid\" style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(265px, 100%), 1fr)); gap: 24px; margin: 0 0 40px\">\n<div style=\"padding: 32px; background: #1a1a1a; border-radius: 4px\">\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 11px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; color: #8fbc8f; margin-bottom: 20px\">Hospitales por titularidad<\u002Fdiv>\n<div style=\"display: flex; gap: 4px; height: 24px; border-radius: 3px; overflow: hidden; margin-bottom: 16px\">\n<div style=\"width: 30%; background: #5a7a60\"><\u002Fdiv>\n<div style=\"width: 70%; background: #3a5a40\"><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; justify-content: space-between\">\n<div>\n<div style=\"font-family: Georgia, serif; font-size: clamp(1.15rem, 3.2vw, 1.5rem); color: #fff\">~16,000<\u002Fdiv>\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 11px; color: #888; margin-top: 2px\">Públicos (30 %)<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"text-align: right\">\n<div style=\"font-family: Georgia, serif; font-size: clamp(1.15rem, 3.2vw, 1.5rem); color: #fff\">~38,000<\u002Fdiv>\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 11px; color: #888; margin-top: 2px\">Privados (70 %)<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"padding: 32px; background: #1a1a1a; border-radius: 4px\">\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 11px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; color: #8fbc8f; margin-bottom: 20px\">Camas por titularidad<\u002Fdiv>\n<div style=\"display: flex; gap: 4px; height: 24px; border-radius: 3px; overflow: hidden; margin-bottom: 16px\">\n<div style=\"width: 55%; background: #5a7a60\"><\u002Fdiv>\n<div style=\"width: 45%; background: #3a5a40\"><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; justify-content: space-between\">\n<div>\n<div style=\"font-family: Georgia, serif; font-size: clamp(1.15rem, 3.2vw, 1.5rem); color: #fff\">710K+<\u002Fdiv>\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 11px; color: #888; margin-top: 2px\">Públicas (55 %)<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"text-align: right\">\n<div style=\"font-family: Georgia, serif; font-size: clamp(1.15rem, 3.2vw, 1.5rem); color: #fff\">~590K<\u002Fdiv>\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 11px; color: #888; margin-top: 2px\">Privadas (45 %)<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<p style=\"font-family: Georgia, serif; font-size: 17px; line-height: 1.8; color: #333; margin: 0 0 24px\">La India cuenta con unos 54.000 hospitales (frente a 43.500 en 2019) y 1,3 millones de camas en total (frente a 1,1 millones). Los hospitales privados suman aproximadamente 38.000, un 27 % más que los 30.000 de 2019, y representan cerca del 62 % de todos los centros sanitarios. El sistema público cuenta con unos 23.600 hospitales y más de 710.000 camas.<\u002Fp>\n<div class=\"wm-grid\" style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(185px, 100%), 1fr)); gap: 24px; margin: 40px 0\">\n<div style=\"padding: 32px; background: #f0eeea; border-radius: 4px; text-align: center\">\n<div style=\"font-family: Georgia, serif; font-size: clamp(1.75rem, 6vw, 3rem); color: #3a5a40; line-height: 1\">1.3<\u002Fdiv>\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 13px; color: #555; margin-top: 8px\">camas por cada 1.000 habitantes<\u002Fdiv>\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 11px; color: #999; margin-top: 4px\">Mediana mundial: 29 por cada 10.000<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"padding: 32px; background: #f0eeea; border-radius: 4px; text-align: center\">\n<div style=\"font-family: Georgia, serif; font-size: clamp(1.75rem, 6vw, 3rem); color: #3a5a40; line-height: 1\">0.79<\u002Fdiv>\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 13px; color: #555; margin-top: 8px\">camas públicas por cada 1.000 hab.<\u002Fdiv>\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 11px; color: #999; margin-top: 4px\">Objetivo: 2,0 según la NHP de 2017<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"padding: 32px; background: #f0eeea; border-radius: 4px; text-align: center\">\n<div style=\"font-family: Georgia, serif; font-size: clamp(1.75rem, 6vw, 3rem); color: #3a5a40; line-height: 1\">1.7M<\u002Fdiv>\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 13px; color: #555; margin-top: 8px\">camas previstas para 2030<\u002Fdiv>\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 11px; color: #999; margin-top: 4px\">+31 % sobre la base actual<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<!-- INFOGRAPHIC: Bed Density Comparison -->\n<div class=\"wm-panel\" style=\"margin: 48px 0; padding: 40px; background: #f0eeea; border-radius: 4px\">\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 11px; font-weight: 600; letter-spacing: 3px; text-transform: uppercase; color: #3a5a40; margin-bottom: 32px\">Camas hospitalarias por cada 1.000 habitantes<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 16px\">\n<div style=\"display: flex; align-items: center; gap: 16px\">\n<div class=\"wm-chart-label\" style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 13px; color: #555; width: 100px; text-align: right; flex-shrink: 0\">Corea del Sur<\u002Fdiv>\n<div style=\"flex: 1; height: 28px; background: #e0ddd8; border-radius: 3px; overflow: hidden; position: relative\">\n<div style=\"width: 96.9%; height: 100%; background: #b0c4b0; border-radius: 3px; display: flex; align-items: center; padding-left: 12px; box-sizing: border-box\">\n<span style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 12px; font-weight: 600; color: #2d4a30\">12.6<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; align-items: center; gap: 16px\">\n<div class=\"wm-chart-label\" style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 13px; color: #555; width: 100px; text-align: right; flex-shrink: 0\">Japón<\u002Fdiv>\n<div style=\"flex: 1; height: 28px; background: #e0ddd8; border-radius: 3px; overflow: hidden; position: relative\">\n<div style=\"width: 100%; height: 100%; background: #b0c4b0; border-radius: 3px; display: flex; align-items: center; padding-left: 12px; box-sizing: border-box\">\n<span style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 12px; font-weight: 600; color: #2d4a30\">13.0<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; align-items: center; gap: 16px\">\n<div class=\"wm-chart-label\" style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 13px; color: #555; width: 100px; text-align: right; flex-shrink: 0\">China<\u002Fdiv>\n<div style=\"flex: 1; height: 28px; background: #e0ddd8; border-radius: 3px; overflow: hidden; position: relative\">\n<div style=\"width: 49.2%; height: 100%; background: #b0c4b0; border-radius: 3px; display: flex; align-items: center; padding-left: 12px\">\n<span style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 12px; font-weight: 600; color: #2d4a30\">6.4<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; align-items: center; gap: 16px\">\n<div class=\"wm-chart-label\" style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 13px; color: #555; width: 100px; text-align: right; flex-shrink: 0\">EE. UU.<\u002Fdiv>\n<div style=\"flex: 1; height: 28px; background: #e0ddd8; border-radius: 3px; overflow: hidden; position: relative\">\n<div style=\"width: 22.3%; height: 100%; background: #b0c4b0; border-radius: 3px; display: flex; align-items: center; padding-left: 12px\">\n<span style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 12px; font-weight: 600; color: #2d4a30\">2.9<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; align-items: center; gap: 16px\">\n<div class=\"wm-chart-label\" style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 13px; color: #555; width: 100px; text-align: right; flex-shrink: 0\">Mediana mundial<\u002Fdiv>\n<div style=\"flex: 1; height: 28px; background: #e0ddd8; border-radius: 3px; overflow: hidden; position: relative\">\n<div style=\"width: 22.3%; height: 100%; background: #8fbc8f; border-radius: 3px; display: flex; align-items: center; padding-left: 12px\">\n<span style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 12px; font-weight: 600; color: #2d4a30\">2.9<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; align-items: center; gap: 16px\">\n<div class=\"wm-chart-label\" style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 13px; color: #1a1a1a; width: 100px; text-align: right; flex-shrink: 0; font-weight: 600\">India<\u002Fdiv>\n<div style=\"flex: 1; height: 32px; background: #e0ddd8; border-radius: 3px; overflow: hidden; position: relative\">\n<div style=\"width: 10%; height: 100%; background: #c45a3c; border-radius: 3px; display: flex; align-items: center; padding-left: 12px\">\n<span style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 13px; font-weight: 700; color: #fff\">1.3<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; align-items: center; gap: 16px\">\n<div class=\"wm-chart-label\" style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 13px; color: #999; width: 100px; text-align: right; flex-shrink: 0; font-style: italic\">India (solo públicas)<\u002Fdiv>\n<div style=\"flex: 1; height: 24px; background: #e0ddd8; border-radius: 3px; overflow: hidden; position: relative\">\n<div style=\"width: 6.1%; height: 100%; background: #c45a3c; border-radius: 3px; opacity: 0.6; min-width: 40px; display: flex; align-items: center; padding-left: 8px\">\n<span style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 11px; font-weight: 600; color: #fff\">0.79<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 11px; color: #999; margin-top: 16px\">La India necesita unos 2,4 millones de camas adicionales para alcanzar la mediana mundial<\u002Fdiv>\n<\u002Fdiv>\n<p style=\"font-family: Georgia, serif; font-size: 17px; line-height: 1.8; color: #333; margin: 0 0 24px\">La India tiene un déficit crítico de aproximadamente 2,4 millones de camas hospitalarias respecto a los estándares mundiales. La escasez es más acusada en los hospitales públicos y en las zonas rurales. El 84 % de las camas hospitalarias públicas se concentra en solo 15 estados. En 15 estados que representan el 74 % de la población, la infraestructura privada supone el 69-70 % del total del sistema sanitario.<\u002Fp>\n<p style=\"font-family: Georgia, serif; font-size: 17px; line-height: 1.8; color: #333; margin: 0 0 24px\">La capacidad de formación médica se ha ampliado notablemente: las facultades de medicina pasaron de 387 (51.348 plazas) en 2014 a 706 (109.145 plazas) en 2024. Las escuelas de enfermería aumentaron de 5.700 a 8.692 en el mismo periodo.<\u002Fp>\n<div style=\"border-left: 3px solid #3a5a40; padding: 24px 0 24px 32px; margin: 40px 0\">\n<div style=\"font-family: Georgia, serif; font-size: clamp(1.25rem, 3.8vw, 1.75rem); line-height: 1.4; color: #1a1a1a\">La India tiene aproximadamente 1,3 camas hospitalarias por cada 1.000 habitantes, muy por debajo de la mediana mundial de 29 por cada 10.000.<\u002Fdiv>\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 12px; color: #999; margin-top: 12px; letter-spacing: 1px; text-transform: uppercase\">IBEF, citando a Knight Frank y Berkadia<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n<!-- SECTION 04: HOSPITAL CHAINS -->\n<section aria-labelledby=\"hospital-chains-heading\" id=\"hospital-chains\" style=\"padding: 64px 0 0; border-top: 1px solid #e0ddd8\">\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 11px; font-weight: 600; letter-spacing: 3px; text-transform: uppercase; color: #3a5a40; margin-bottom: 16px\">04<\u002Fdiv>\n<h2 id=\"hospital-chains-heading\" style=\"font-family: Georgia, serif; font-size: clamp(1.45rem, 4.8vw, 2.25rem); font-weight: 400; color: #1a1a1a; margin: 0 0 32px; line-height: 1.2\">Cadenas hospitalarias y panorama competitivo<\u002Fh2>\n<p style=\"font-family: Georgia, serif; font-size: 17px; line-height: 1.8; color: #333; margin: 0 0 24px\">El mercado está muy fragmentado: las cadenas organizadas representan una pequeña parte del total de hospitales, pero dominan en ingresos, reconocimiento de marca y crecimiento. El sur de la India es el clúster hospitalario organizado más profundo, con Chennai, Bengaluru y Hyderabad combinando disponibilidad de especialistas, flujos de derivación y capacidad de las cadenas.<\u002Fp>\n<!-- Chain comparison table -->\n<div style=\"margin: 32px 0; overflow-x: auto\">\n<div aria-hidden=\"true\" class=\"wm-scroll-hint\">Desplázate horizontalmente para ver todas las columnas →<\u002Fdiv><div aria-label=\"Leading Indian hospital chains by scale and performance, FY25\" class=\"wm-table-scroll\" role=\"region\" tabindex=\"0\"><sc-raw-table style=\"width: 100%; border-collapse: collapse; font-family: 'IBM Plex Sans', sans-serif; font-size: 14px\"><sc-raw-caption>Principales cadenas hospitalarias indias por escala y rendimiento, ejercicio 2025<\u002Fsc-raw-caption>\n<sc-raw-thead>\n<sc-raw-tr style=\"border-bottom: 2px solid #1a1a1a\">\n<sc-raw-th scope=\"col\" style=\"text-align: left; padding: 12px 16px 12px 0; font-weight: 600; color: #1a1a1a\">Cadena hospitalaria<\u002Fsc-raw-th>\n<sc-raw-th scope=\"col\" style=\"text-align: right; padding: 12px 16px; font-weight: 600; color: #1a1a1a\">Hospitales<\u002Fsc-raw-th>\n<sc-raw-th scope=\"col\" style=\"text-align: right; padding: 12px 16px; font-weight: 600; color: #1a1a1a\">Camas<\u002Fsc-raw-th>\n<sc-raw-th scope=\"col\" style=\"text-align: right; padding: 12px 16px; font-weight: 600; color: #1a1a1a\">Ingresos (ej. 2025)<\u002Fsc-raw-th>\n<sc-raw-th scope=\"col\" style=\"text-align: right; padding: 12px 16px; font-weight: 600; color: #1a1a1a\">ARPOB<\u002Fsc-raw-th>\n<sc-raw-th scope=\"col\" style=\"text-align: right; padding: 12px 0 12px 16px; font-weight: 600; color: #1a1a1a\">Ocupación<\u002Fsc-raw-th>\n<\u002Fsc-raw-tr>\n<\u002Fsc-raw-thead>\n<sc-raw-tbody>\n<sc-raw-tr style=\"border-bottom: 1px solid #eee\">\n<sc-raw-td data-label=\"Hospital Chain\" style=\"padding: 14px 16px 14px 0; font-weight: 500; color: #1a1a1a\">Apollo Hospitals<\u002Fsc-raw-td>\n<sc-raw-td data-label=\"Hospitals\" style=\"padding: 14px 16px; text-align: right; color: #555\">73<\u002Fsc-raw-td>\n<sc-raw-td data-label=\"Beds\" style=\"padding: 14px 16px; text-align: right; color: #555\">10,209<\u002Fsc-raw-td>\n<sc-raw-td data-label=\"Revenue (FY25)\" style=\"padding: 14px 16px; text-align: right; color: #555\">21.794 mill. ₹<\u002Fsc-raw-td>\n<sc-raw-td px\">\n<div class=\"wm-chart-label\" style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 13px; color: #1a1a1a; width: 110px; text-align: right; flex-shrink: 0; font-weight: 500\">Apollo<\u002Fdiv>\n<div style=\"flex: 1; display: flex; align-items: center; gap: 12px\">\n<div style=\"height: 28px; width: 100%; background: #3a5a40; border-radius: 3px; display: flex; align-items: center; padding-left: 12px\">\n<span style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 12px; color: #fff; font-weight: 600\">10.209 camas · 21.794 mill. ₹<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; align-items: center; gap: 16px\">\n<div class=\"wm-chart-label\" style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 13px; color: #1a1a1a; width: 110px; text-align: right; flex-shrink: 0; font-weight: 500\">Narayana<\u002Fdiv>\n<div style=\"flex: 1; display: flex; align-items: center; gap: 12px\">\n<div style=\"height: 28px; width: 59.7%; background: #4a6a50; border-radius: 3px; display: flex; align-items: center; padding-left: 12px\">\n<span style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 12px; color: #fff; font-weight: 600\">6.100 camas · 5.483 mill. ₹<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; align-items: center; gap: 16px\">\n<div class=\"wm-chart-label\" style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 13px; color: #1a1a1a; width: 110px; text-align: right; flex-shrink: 0; font-weight: 500\">Max<\u002Fdiv>\n<div style=\"flex: 1; display: flex; align-items: center; gap: 12px\">\n<div style=\"height: 28px; width: 49%; background: #5a7a60; border-radius: 3px; display: flex; align-items: center; padding-left: 12px\">\n<span style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 12px; color: #fff; font-weight: 600\">5.000 camas · 7.028 mill. ₹<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; align-items: center; gap: 16px\">\n<div class=\"wm-chart-label\" style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 13px; color: #1a1a1a; width: 110px; text-align: right; flex-shrink: 0; font-weight: 500\">Aster DM<\u002Fdiv>\n<div style=\"flex: 1; display: flex; align-items: center; gap: 12px\">\n<div style=\"height: 28px; width: 49%; background: #6a8a70; border-radius: 3px; display: flex; align-items: center; padding-left: 12px\">\n<span style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 12px; color: #fff; font-weight: 600\">5.000 camas<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; align-items: center; gap: 16px\">\n<div class=\"wm-chart-label\" style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 13px; color: #1a1a1a; width: 110px; text-align: right; flex-shrink: 0; font-weight: 500\">KIMS<\u002Fdiv>\n<div style=\"flex: 1; display: flex; align-items: center; gap: 12px\">\n<div style=\"height: 28px; width: 48%; background: #7a9a80; border-radius: 3px; display: flex; align-items: center; padding-left: 12px\">\n<span style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 12px; color: #fff; font-weight: 600\">4.900 camas<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; align-items: center; gap: 16px\">\n<div class=\"wm-chart-label\" style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 13px; color: #1a1a1a; width: 110px; text-align: right; flex-shrink: 0; font-weight: 500\">Fortis<\u002Fdiv>\n<div style=\"flex: 1; display: flex; align-items: center; gap: 12px\">\n<div style=\"height: 28px; width: 45%; background: #8aaa90; border-radius: 3px; display: flex; align-items: center; padding-left: 12px\">\n<span style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 12px; color: #1a1a1a; font-weight: 600\">4.600 camas · 7.783 mill. ₹<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; align-items: center; gap: 16px\">\n<div class=\"wm-chart-label\" style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 13px; color: #1a1a1a; width: 110px; text-align: right; flex-shrink: 0; font-weight: 500\">Medanta<\u002Fdiv>\n<div style=\"flex: 1; display: flex; align-items: center; gap: 12px\">\n<div style=\"height: 28px; width: 27.4%; background: #9aba9f; border-radius: 3px; display: flex; align-items: center; padding-left: 12px\">\n<span style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 12px; color: #1a1a1a; font-weight: 600\">más de 2.800 camas<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<p style=\"font-family: Georgia, serif; font-size: 17px; line-height: 1.8; color: #333; margin: 0 0 24px\">Pese a tener menos hospitales y camas, la capitalización bursátil de Max Healthcare rivaliza con la de Apollo, lo que evidencia que la eficiencia y la calidad de los ingresos pueden importar más que el tamaño. Max Healthcare lidera en ARPOB con 73.000 ₹/día, seguida de Fortis con 66.301 ₹.<\u002Fp>\n<h3 id=\"expansion-pipeline\" style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 18px; font-weight: 600; color: #1a1a1a; margin: 40px 0 16px\">Plan de expansión<\u002Fh3>\n<p style=\"font-family: Georgia, serif; font-size: 17px; line-height: 1.8; color: #333; margin: 0 0 24px\">Las grandes cadenas se expanden con agresividad. Apollo prevé unas 3.400 camas entre los ejercicios 2027 y 2030. Medanta espera unas 2.700 camas en 3-4 años. Fortis planea 1.800 camas. La plataforma conjunta de Aster DM y Quality Care pretende sumar unas 4.445 camas. Las estrategias abarcan construcciones nuevas, ampliaciones de centros existentes y adquisiciones, con creciente peso de los contratos de gestión sin activos.<\u002Fp>\n<\u002Fsection>\n<!-- SECTION 4B: HOSPITAL KPI DASHBOARD -->\n<section aria-labelledby=\"performance-dashboard-heading\" id=\"performance-dashboard\" style=\"padding: 64px 0 0; border-top: 1px solid #e0ddd8\">\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 11px; font-weight: 600; letter-spacing: 3px; text-transform: uppercase; color: #3a5a40; margin-bottom: 16px\">04b<\u002Fdiv>\n<h2 id=\"performance-dashboard-heading\" style=\"font-family: Georgia, serif; font-size: clamp(1.45rem, 4.8vw, 2.25rem); font-weight: 400; color: #1a1a1a; margin: 0 0 16px; line-height: 1.2\">Panel de rendimiento hospitalario<\u002Fh2>\n<p style=\"font-family: Georgia, serif; font-size: 17px; line-height: 1.8; color: #333; margin: 0 0 40px\">Principales métricas operativas de las mayores cadenas hospitalarias de la India, extraídas de las cuentas de los ejercicios 2025 y 2026 y de las presentaciones a inversores. Estos indicadores —ARPOB, ocupación, margen EBITDA e ingresos por cama— son los que más vigilan inversores y operadores.<\u002Fp>\n<!-- INFOGRAPHIC 1: ARPOB Ranking -->\n<div class=\"wm-panel\" style=\"margin: 0 0 48px; padding: 40px; background: #1a1a1a; border-radius: 4px\">\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 11px; font-weight: 600; letter-spacing: 3px; text-transform: uppercase; color: #8fbc8f; margin-bottom: 8px\">Ingreso medio por cama ocupada<\u002Fdiv>\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 12px; color: #666; margin-bottom: 28px\">₹ por día · cuentas ej. 2025/2026<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 10px\">\n<div style=\"display: flex; align-items: center; gap: 12px\">\n<div class=\"wm-chart-label\" style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 12px; color: #fff; width: 90px; text-align: right; flex-shrink: 0; font-weight: 500\">Max<\u002Fdiv>\n<div style=\"flex: 1; height: 26px; background: #2a2a2a; border-radius: 3px; overflow: hidden\">\n<div style=\"width: 100%; height: 100%; background: linear-gradient(90deg, #3a5a40, #5a8a60); border-radius: 3px; display: flex; align-items: center; padding-left: 10px; box-sizing: border-box\">\n<span style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 11px; color: #fff; font-weight: 700\">₹77,800<\u002Fspa nter; gap: 12px\">\n<div class=\"wm-chart-label\" style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 12px; color: #ccc; width: 90px; text-align: right; flex-shrink: 0\">Fortis<\u002Fdiv>\n<div style=\"flex: 1; height: 26px; background: #2a2a2a; border-radius: 3px; overflow: hidden\">\n<div style=\"width: 40.5%; height: 100%; background: #c45a3c; border-radius: 3px; display: flex; align-items: center; padding-left: 10px; box-sizing: border-box\">\n<span style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 11px; color: #fff; font-weight: 600\">+1.800 camas<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; align-items: center; gap: 12px\">\n<div class=\"wm-chart-label\" style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 12px; color: #ccc; width: 90px; text-align: right; flex-shrink: 0\">Narayana<\u002Fdiv>\n<div style=\"flex: 1; height: 26px; background: #2a2a2a; border-radius: 3px; overflow: hidden\">\n<div style=\"width: 32.3%; height: 100%; background: #c45a3c; border-radius: 3px; display: flex; align-items: center; padding-left: 10px; box-sizing: border-box\">\n<span style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 11px; color: #fff; font-weight: 600\">+1.435 camas (para el ej. 2030)<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 11px; color: #555; margin-top: 16px\">Se espera que las principales cadenas inviertan en conjunto 40.000 millones de rupias para sumar más de 38.000 camas antes de 2030, combinando obra nueva, ampliaciones y modelos de gestión.<\u002Fdiv>\n<\u002Fdiv>\n<!-- Key Insight -->\n<div style=\"border-left: 3px solid #3a5a40; padding: 24px 0 24px 32px; margin: 40px 0\">\n<div style=\"font-family: Georgia, serif; font-size: clamp(1.25rem, 3.8vw, 1.75rem); line-height: 1.4; color: #1a1a1a\">Max Healthcare genera 77.800 ₹ por cama y día —casi el doble de la media del sector— con la mayor ocupación y el mayor margen EBITDA del sector.<\u002Fdiv>\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 12px; color: #999; margin-top: 12px; letter-spacing: 1px; text-transform: uppercase\">IndMoney y cuentas de las compañías, ej. 2025/2026<\u002Fdiv>\n<\u002Fdiv>\n<p style=\"font-family: Georgia, serif; font-size: 17px; line-height: 1.8; color: #333; margin: 0 0 24px\">Los datos revelan arquetipos estratégicos claros. Max Healthcare es la líder en eficiencia: la que menos camas tiene entre las grandes cadenas, pero con el mayor ARPOB, ocupación y márgenes. Apollo apuesta por la escala: los mayores ingresos y la mayor red de camas, diversificada en farmacia y diagnóstico. Manipal es la constructora de escala mediante adquisiciones, hoy la mayor de la India por número de camas tras absorber Columbia Asia, Medica y Sahyadri. KIMS crece a nivel regional con eficiencia de capital y márgenes estables. Narayana representa el modelo asequible basado en volumen. Todas han logrado un crecimiento sostenido de dos dígitos, lo que confirma la profundidad de la demanda hospitalaria india.<\u002Fp>\n<\u002Fsection>\n<!-- SECTION 05: HOSPITAL ECONOMICS -->\n<section aria-labelledby=\"hospital-economics-heading\" id=\"hospital-economics\" style=\"padding: 64px 0 0; border-top: 1px solid #e0ddd8\">\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 11px; font-weight: 600; letter-spacing: 3px; text-transform: uppercase; color: #3a5a40; margin-bottom: 16px\">05<\u002Fdiv>\n<h2 id=\"hospital-economics-heading\" style=\"font-family: Georgia, serif; font-size: clamp(1.45rem, 4.8vw, 2.25rem); font-weight: 400; color: #1a1a1a; margin: 0 0 32px; line-height: 1.2\">Economía hospitalaria<\u002Fh2>\n<p style=\"font-family: Georgia, serif; font-size: 17px; line-height: 1.8; color: #333; margin: 0 0 24px\">Los principales hospitales privados de la India registraron un aumento del 23 % en el ingreso medio diario por cama en el ejercicio 2025, hasta 49.304 ₹. Este crecimiento se apoya en el auge de tratamientos de alto valor, como la oncología y la cirugía robótica, junto con una mayor capacidad de pago de los pacientes gracias a la cobertura aseguradora.<\u002Fp>\n<div class=\"wm-grid\" style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(265px, 100%), 1fr)); gap: 24px; margin: 32px 0\">\n<div style=\"background: #3a5a40; color: #fff; padding: 32px; border-radius: 4px\">\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: #8fbc8f; margin-bottom: 12px\">Ingreso anual por cama (principales cadenas)<\u002Fdiv>\n<div style=\"font-family: Georgia, serif; font-size: clamp(1.45rem, 4.8vw, 2.25rem); line-height: 1.2\">1,75 – 2,84 mill. ₹<\u002Fdiv>\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 13px; color: #b0c9b0; margin-top: 8px\">De Narayana (mínimo) a Max Healthcare (máximo)<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"background: #3a5a40; color: #fff; padding: 32px; border-radius: 4px\">\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: #8fbc8f; margin-bottom: 12px\">Rango de ocupación (grandes cadenas)<\u002Fdiv>\n<div style=\"font-family: Georgia, serif; font-size: clamp(1.45rem, 4.8vw, 2.25rem); line-height: 1.2\">60–76%<\u002Fdiv>\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 13px; color: #b0c9b0; margin-top: 8px\">Deja margen para crecer en volumen<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<h3 id=\"revenue-drivers\" style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 18px; font-weight: 600; color: #1a1a1a; margin: 40px 0 16px\">Motores de ingresos<\u002Fh3>\n<p style=\"font-family: Georgia, serif; font-size: 17px; line-height: 1.8; color: #333; margin: 0 0 24px\">La cardiología y la oncología son los pilares de ingresos. Aster DM informó de que estas dos especialidades aportaron casi una cuarta parte de los ingresos, con crecimientos del 25 % y el 23 % respectivamente en el ejercicio 2026. Apollo y Max Healthcare registraron ambas un crecimiento del 16 % en el ejercicio 2026, mientras que Fortis, KIMS y Medanta también crecieron a doble dígito.<\u002Fp>\n<p style=\"font-family: Georgia, serif; font-size: 17px; line-height: 1.8; color: #333; margin: 0 0 24px\">Entre los indicadores clave por los que se mide a los hospitales están el ARPOB (ingreso medio por cama ocupada), la tasa de ocupación, la estancia media y el margen de contribución por especialidad. La tendencia apunta a estancias más cortas con procedimientos de mayor complejidad, lo que eleva el ingreso diario aunque el importe total de la factura se mantenga.<\u002Fp>\n<h3 id=\"expansion-economics\" style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 18px; font-weight: 600; color: #1a1a1a; margin: 40px 0 16px\">Economía de la expansión<\u002Fh3>\n<p style=\"font-family: Georgia, serif; font-size: 17px; line-height: 1.8; color: #333; margin: 0 0 24px\">Las cadenas hospitalarias siguen tres estrategias de expansión: obra nueva (construir hospitales, más lento e intensivo en capital), ampliación de centros existentes (más rápido y barato) y modelos sin activos (contratos de gestión y alianzas). Hoy la mayoría combina las tres, con las dos últimas ganando terreno por su retorno más rápido.<\u002Fp>\n<\u002Fsection>\n<!-- SECTION 05b: REVENUE BY SPECIALTY -->\n<section aria-labelledby=\"revenue-by-specialty-heading\" id=\"revenue-by-specialty\" style=\"padding: 64px 0 0; border-top: 1px solid #e0ddd8\">\n<div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 11px; font-weight: 600; letter-spacing: 3px; text-transform: uppercase; color: #3a5a40; margin-bottom: 16px\">05b<\u002Fdiv>\n<h2 id=\"revenue-by-specialty-heading\" style=\"font-family: Georgia, serif; font-size: clamp(1.45rem, 4.8vw, 2.25rem); font-weight: 400; color: #1a1a1a; margin: 0 0 32px; line-height: 1.2\">Ingresos por especialidad<\u002Fh2>\n
