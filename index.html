<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WiseHealth</title>
<!-- The site is two pages now: /appointment and /ticketing. The root forwards
     to /appointment, and carries old single-page anchors (/#omnichannel,
     /#ticketing …) to whichever page that section now lives on. -->
<meta http-equiv="refresh" content="0; url=appointment">
<link rel="canonical" href="appointment">
<script>
  (function () {
    var h = location.hash || '';
    var page = /^#(ticketing|raiseticket)$/.test(h) ? 'ticketing' : 'appointment';
    location.replace(page + location.search + h);
  })();
</script>
<style>body{margin:0;display:grid;place-items:center;min-height:100vh;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;background:#fff;color:#6E6E76}a{color:#12A594}</style>
</head>
<body><a href="appointment">Continue to WiseHealth</a></body>
</html>
